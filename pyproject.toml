[project]
name = "claude-logging-plugin"
version = "1.0.0"
description = "Comprehensive logging, search, and visualization for Claude Code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",

    # Storage (standard library sqlite3 is sufficient for FTS5)
    # No additional dependencies for JSONL

    # Optional: Embeddings (install with: pip install .[embeddings])
    # sentence-transformers>=2.2.0
    # numpy>=1.24.0
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]
streaming = [
    "watchfiles>=0.21.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]
all = [
    "claude-logging-plugin[embeddings,streaming,dev]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length handled by formatter
    "SIM108",  # ternary operator preference
    "UP007",   # Optional[X] -> X | None (keep for 3.10 clarity)
    "B904",    # raise from — HTTPException re-raises are idiomatic FastAPI
    "B905",    # zip strict — Python 3.10 compat
]

[tool.ruff.lint.per-file-ignores]
"hooks/*" = ["E402"]     # sys.path before imports
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
"contrib/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["lib", "hooks", "api"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
