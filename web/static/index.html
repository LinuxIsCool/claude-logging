<script>
'use strict';

const PERSONAS = ['matt', 'shawn', 'darren', 'eve', 'legion'];

const state = {
  tab: 'prompts',
  projectSlug: '',
  personaFilter: '',
  prompts: [],
  searchResults: null,
  stats: null,
  projects: [],
  currentSession: null,
  currentPromptDetail: null,
  transcriptMode: 'clean',
};

// ── URL / path helpers ─────────────────────────────────────────────

function pathPrefix() {
  const p = window.location.pathname;
  if (p === '/' || p === '/index.html' || p.startsWith('/?')) return '';
  const parts = p.split('/').filter(Boolean);
  if (parts.length === 0) return '';
  return '/' + parts[0];
}

async function api(path, params) {
  const prefix = pathPrefix();
  const url = new URL(prefix + path, window.location.origin);
  if (params) {
    for (const k in params) {
      if (params[k] !== '' && params[k] != null) {
        url.searchParams.set(k, params[k]);
      }
    }
  }
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error(`${path} → HTTP ${res.status}`);
  return await res.json();
}

// ── Rendering helpers ──────────────────────────────────────────────

function fmtTime(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    const diff = (Date.now() - d) / 1000;
    if (diff < 60) return Math.floor(diff) + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toISOString().slice(0, 10);
  } catch { return iso; }
}

function personaCls(persona) {
  if (!persona) return '';
  return PERSONAS.includes(persona) ? persona : '';
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
}

function shortenSlug(slug) {
  if (!slug) return '';
  // -home-shawn-legion-koi → legion-koi
  // -home-shawn-.claude-plugins-local-legion-plugins-plugins-claude-X → plugins/claude-X
  if (slug.includes('-plugins-local-legion-plugins-plugins-')) {
    const m = slug.match(/-plugins-local-legion-plugins-plugins-(.+)$/);
    if (m) return 'plugins/' + m[1];
  }
  if (slug.startsWith('-home-shawn-')) {
    return slug.replace('-home-shawn-', '');
  }
  return slug;
}

// ── Cards ──────────────────────────────────────────────────────────

function renderPromptCard(p) {
  const persona = p.persona || 'claude';
  const personaCls_ = `persona-${personaCls(persona) || 'claude'}`;
  const badgeCls = personaCls(persona);
  return `
    <div class="card flex animate-fade-in cursor-pointer mb-2" data-event-id="${escapeHtml(p.event_id)}" data-session="${escapeHtml(p.session_id || '')}">
      <div class="persona-rail ${personaCls_}"></div>
      <div class="flex-1 p-3 min-w-0">
        <div class="flex items-center gap-2 text-xs mb-2 flex-wrap">
          <span class="badge ${badgeCls}">${escapeHtml(persona)}</span>
          <span class="text-overlay1 truncate" title="${escapeHtml(p.project_slug)}">${escapeHtml(shortenSlug(p.project_slug))}</span>
          <span class="text-overlay0 ml-auto" data-age data-iso="${escapeHtml(p.ts)}">${fmtTime(p.ts)}</span>
        </div>
        <div class="preview text-sm">${escapeHtml(p.preview || '')}</div>
      </div>
    </div>
  `;
}

function renderEventRow(e) {
  const isPrompt = e.type === 'UserPromptSubmit';
  const isResponse = e.type === 'AssistantResponse';
  const headerColor = isPrompt ? 'text-mauve' : isResponse ? 'text-green' : 'text-sky';
  const content = e.content || (e.data?.response) || (e.data?.prompt) || '';
  return `
    <div class="card p-3 animate-fade-in mb-2">
      <div class="flex items-center gap-2 text-xs mb-2 flex-wrap">
        <span class="badge ${headerColor}">${escapeHtml(e.type)}</span>
        ${e.persona ? `<span class="badge ${personaCls(e.persona)}">${escapeHtml(e.persona)}</span>` : ''}
        ${e.tool_name ? `<span class="badge badge-tool">${escapeHtml(e.tool_name)}</span>` : ''}
        <span class="text-overlay0 ml-auto" data-age data-iso="${escapeHtml(e.ts)}">${fmtTime(e.ts)}</span>
      </div>
      ${content ? `<div class="preview text-sm">${escapeHtml(content)}</div>` : ''}
    </div>
  `;
}

// ── Detail panel ───────────────────────────────────────────────────

function renderDetail() {
  const slot = document.getElementById('detail-slot');
  if (!state.currentPromptDetail) {
    slot.innerHTML = `
      <div class="font-pixel text-mauve mb-2 text-[0.65rem]">DETAIL</div>
      <div class="text-overlay0 text-xs">No prompt selected. Click a card to see its session transcript here.</div>
    `;
    return;
  }
  const p = state.currentPromptDetail;
  const persona = p.persona || 'claude';
  slot.innerHTML = `
    <div class="font-pixel text-mauve mb-3 text-[0.65rem]">DETAIL</div>
    <div class="space-y-2 text-xs">
      <div><span class="text-overlay0">persona:</span> <span class="badge ${personaCls(persona)}">${escapeHtml(persona)}</span></div>
      <div><span class="text-overlay0">project:</span> <span class="text-subtext1">${escapeHtml(shortenSlug(p.project_slug))}</span></div>
      <div><span class="text-overlay0">session:</span> <code class="text-mauve">${escapeHtml((p.session_id || '').slice(0, 8))}…</code></div>
      <div><span class="text-overlay0">time:</span> <span class="text-subtext1">${escapeHtml(p.ts)}</span></div>
      ${p.tool_name ? `<div><span class="text-overlay0">tool:</span> <span class="badge badge-tool">${escapeHtml(p.tool_name)}</span></div>` : ''}
      <hr class="border-surface0 my-2" />
      <button class="view-nav-item w-full text-center" data-action="open-transcript">view full transcript →</button>
    </div>
  `;
  slot.querySelector('[data-action="open-transcript"]')?.addEventListener('click', () => {
    state.currentSession = p.session_id;
    navigate('transcript');
  });
}

// ── Tab renderers ──────────────────────────────────────────────────

async function renderPromptsTab() {
  const main = document.getElementById('view-root');
  main.innerHTML = `
    <div class="mb-3 flex items-center justify-between gap-2 flex-wrap">
      <div class="text-xs text-subtext0">recent prompts${state.projectSlug ? ` in <span class="text-mauve">${escapeHtml(shortenSlug(state.projectSlug))}</span>` : ' · all projects'}${state.personaFilter ? ` · <span class="text-mauve">${escapeHtml(state.personaFilter)}</span>` : ''}</div>
      <input id="quick-q" type="text" placeholder="quick filter…" class="txt text-xs" />
    </div>
    <div id="prompts-list" class="empty">Loading…</div>
  `;
  document.getElementById('quick-q').addEventListener('input', (e) => {
    clearTimeout(window._qDebounce);
    window._qDebounce = setTimeout(() => loadPrompts(e.target.value), 250);
  });
  await loadPrompts('');
}

async function loadPrompts(q) {
  const list = document.getElementById('prompts-list');
  try {
    const params = { limit: 50 };
    if (state.projectSlug) params.project_slug = state.projectSlug;
    if (state.personaFilter) params.persona = state.personaFilter;
    if (q) params.q = q;
    const prompts = await api('/api/prompts', params);
    state.prompts = prompts;
    if (prompts.length === 0) {
      list.innerHTML = `<div class="empty">No prompts found.</div>`;
      return;
    }
    list.innerHTML = prompts.map(renderPromptCard).join('\n');
    wireCards(list);
  } catch (e) {
    list.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
  }
}

function wireCards(root) {
  root.querySelectorAll('[data-event-id]').forEach(el => {
    el.addEventListener('click', () => {
      const eventId = el.dataset.eventId;
      const prompt = (state.prompts || []).concat(state.searchResults?.results || []).find(p => p.event_id === eventId);
      if (prompt) {
        state.currentPromptDetail = prompt;
        state.currentSession = prompt.session_id;
        renderDetail();
      }
    });
  });
  root.querySelectorAll('.preview').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      el.classList.toggle('expanded');
    });
  });
}

async function renderTranscriptTab() {
  const main = document.getElementById('view-root');
  if (!state.currentSession) {
    try {
      const sessions = await api('/api/sessions', { limit: 1 });
      if (sessions.length === 0) {
        main.innerHTML = `<div class="empty">No sessions captured.</div>`;
        return;
      }
      state.currentSession = sessions[0].session_id;
    } catch (e) {
      main.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
      return;
    }
  }
  main.innerHTML = `<div class="empty">Loading transcript…</div>`;
  try {
    const t = await api('/api/transcript', {
      session: state.currentSession,
      mode: state.transcriptMode,
    });
    if (t.error) {
      main.innerHTML = `<div class="empty text-red">${escapeHtml(t.error)}</div>`;
      return;
    }
    main.innerHTML = `
      <div class="mb-3 flex items-center gap-3 text-xs flex-wrap">
        <div class="text-subtext0">
          Session <code class="text-mauve">${escapeHtml(t.session_id.slice(0, 8))}…</code>
          in <span class="text-sky">${escapeHtml(shortenSlug(t.project_slug))}</span>
          · ${t.event_count} event${t.event_count === 1 ? '' : 's'}
        </div>
        <div class="ml-auto flex gap-1">
          <button class="view-nav-item ${state.transcriptMode==='clean'?'active':''}" data-mode="clean">Clean</button>
          <button class="view-nav-item ${state.transcriptMode==='full'?'active':''}" data-mode="full">Full</button>
        </div>
      </div>
      <div>${t.events.map(renderEventRow).join('\n')}</div>
    `;
    main.querySelectorAll('[data-mode]').forEach(el => {
      el.addEventListener('click', () => {
        state.transcriptMode = el.dataset.mode;
        renderTranscriptTab();
      });
    });
    main.querySelectorAll('.preview').forEach(el => {
      el.addEventListener('click', () => el.classList.toggle('expanded'));
    });
  } catch (e) {
    main.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
  }
}

async function renderSearchTab() {
  const main = document.getElementById('view-root');
  main.innerHTML = `
    <form id="search-form" class="mb-4 flex gap-2 items-center flex-wrap">
      <input type="text" name="q" placeholder="Search prompts + events…" class="txt flex-1 min-w-[260px]" autocomplete="off" autofocus />
      <select name="mode" class="txt">
        <option value="prompts">Prompts (FTS5)</option>
        <option value="events">All events (FTS5)</option>
      </select>
      <button type="submit" class="view-nav-item active">Go</button>
    </form>
    <div class="text-xs text-overlay0 mb-3">FTS5 supports: <code>foo AND bar</code>, <code>"exact phrase"</code>, <code>fo*</code>. Hyphens auto-quoted.</div>
    <div id="search-results"></div>
  `;
  const form = document.getElementById('search-form');
  const resultsEl = document.getElementById('search-results');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const q = fd.get('q');
    const mode = fd.get('mode');
    if (!q) { resultsEl.innerHTML = ''; return; }
    resultsEl.innerHTML = `<div class="empty">Searching…</div>`;
    try {
      const r = await api('/api/search', { q, mode });
      state.searchResults = r;
      if (r.results.length === 0) {
        resultsEl.innerHTML = `<div class="empty">No matches for "${escapeHtml(q)}".</div>`;
        return;
      }
      resultsEl.innerHTML = `
        <div class="text-xs text-subtext0 mb-2">${r.results.length} match${r.results.length === 1 ? '' : 'es'} for "${escapeHtml(r.q)}" (${escapeHtml(r.mode)} mode)</div>
        ${r.results.map(renderPromptCard).join('\n')}
      `;
      wireCards(resultsEl);
    } catch (e) {
      resultsEl.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
    }
  });
}

async function renderSettingsTab() {
  const main = document.getElementById('view-root');
  main.innerHTML = `<div class="empty">Loading stats…</div>`;
  try {
    const stats = await api('/api/stats');
    state.stats = stats;
    const types = Object.entries(stats.events_by_type || {});
    main.innerHTML = `
      <div class="space-y-4">
        <div class="card p-4">
          <div class="font-pixel text-sm text-mauve mb-3">CORPUS HEALTH</div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
            <div><div class="text-subtext0 text-xs">Prompts</div><div class="text-2xl font-bold text-mauve">${(stats.key_metric||0).toLocaleString()}</div></div>
            <div><div class="text-subtext0 text-xs">Projects</div><div class="text-2xl font-bold text-sky">${(stats.projects||0).toLocaleString()}</div></div>
            <div><div class="text-subtext0 text-xs">Sessions</div><div class="text-2xl font-bold text-green">${(stats.sessions||0).toLocaleString()}</div></div>
            <div><div class="text-subtext0 text-xs">Total events</div><div class="text-2xl font-bold text-teal">${(stats.events||0).toLocaleString()}</div></div>
          </div>
          ${stats.last_synced_at ? `<div class="mt-3 text-xs text-overlay0">Rollup last synced: <span class="text-subtext0">${escapeHtml(stats.last_synced_at)}</span></div>` : ''}
        </div>

        <div class="card p-4">
          <div class="font-pixel text-sm text-mauve mb-3">EVENT-TYPE DISTRIBUTION</div>
          <div class="space-y-1 text-sm">
            ${types.slice(0, 15).map(([t, n]) => {
              const max = types[0][1];
              const pct = (n / max) * 100;
              return `
                <div class="flex items-center gap-2">
                  <div class="w-48 text-subtext0 truncate">${escapeHtml(t)}</div>
                  <div class="flex-1 bg-surface0 h-4 rounded overflow-hidden">
                    <div class="bg-mauve h-full" style="width: ${pct}%"></div>
                  </div>
                  <div class="text-overlay1 text-xs w-20 text-right">${n.toLocaleString()}</div>
                </div>
              `;
            }).join('\n')}
          </div>
        </div>

        <div class="card p-4">
          <div class="font-pixel text-sm text-mauve mb-3">ABOUT</div>
          <div class="space-y-2 text-xs text-subtext0">
            <div>Plugin: <span class="text-text">claude-logging v2.0.0-pre</span> · task-508 Phase 2</div>
            <div>Namespace: <span class="text-text">legion.claude-logging</span></div>
            <div>Cross-project index: <span class="text-text">~/.claude/local/logging/_index/index.db</span></div>
            <div>Capture pipeline: 25 hook event types · WAL journal · JSONL source-of-truth · SQLite rebuildable</div>
            <div>Cluster role: 9th satellite of claude-webui (Observability cluster)</div>
            <div class="pt-2 text-overlay0 italic">Phase 2 ships 4 tabs. Phases 4-9 add Queue (TTS YouTube-style), Live (SSE), Slice (10 charts), Annotations, Pastes, mobile-responsive layout.</div>
          </div>
        </div>
      </div>
    `;
  } catch (e) {
    main.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
  }
}

// ── Navigation ─────────────────────────────────────────────────────

const tabRenderers = {
  prompts: renderPromptsTab,
  transcript: renderTranscriptTab,
  search: renderSearchTab,
  settings: renderSettingsTab,
};

function navigate(tab) {
  if (!tabRenderers[tab]) tab = 'prompts';
  state.tab = tab;
  document.querySelectorAll('.view-nav-item[data-tab]').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  const newHash = '#' + tab + (tab === 'transcript' && state.currentSession ? '?session=' + state.currentSession : '');
  if (window.location.hash !== newHash) window.location.hash = newHash;
  tabRenderers[tab]();
  // Close mobile sidebar on nav
  document.body.classList.remove('scrim-open');
  document.getElementById('mobile-scrim').classList.add('hidden');
}

function parseHash() {
  const hash = window.location.hash.replace(/^#/, '');
  if (!hash) return 'prompts';
  const [tab, query] = hash.split('?');
  if (query) {
    const qp = new URLSearchParams(query);
    if (qp.has('session')) state.currentSession = qp.get('session');
  }
  return tab || 'prompts';
}

// ── Stats / health / projects boot ─────────────────────────────────

async function refreshStats() {
  try {
    const s = await api('/api/stats');
    state.stats = s;
    document.getElementById('stat-prompts').textContent = (s.key_metric || 0).toLocaleString();
    document.getElementById('stat-events').textContent = (s.events || 0).toLocaleString();
    document.getElementById('stat-projects').textContent = (s.projects || 0).toLocaleString();
    document.getElementById('stat-sessions').textContent = (s.sessions || 0).toLocaleString();
  } catch (e) {
    console.error('stats failed:', e);
  }
}

async function refreshHealthBadge() {
  try {
    const r = await fetch(pathPrefix() + '/healthz');
    const j = await r.json();
    const slot = document.getElementById('healthz-slot');
    if (j.ok) {
      slot.innerHTML = `<span class="text-green" title="healthz ok · ${j.elapsed_ms}ms">●</span>`;
    } else {
      slot.innerHTML = `<span class="text-red" title="${escapeHtml((j.issues || []).join(' · '))}">●</span>`;
    }
    document.getElementById('footer-status').textContent = `${(j.stats?.key_metric || 0).toLocaleString()} events · ${j.stats?.projects || 0} projects`;
  } catch (e) {
    document.getElementById('healthz-slot').innerHTML = `<span class="text-red">●</span>`;
  }
}

async function loadProjects() {
  try {
    const projects = await api('/api/projects');
    state.projects = projects;
    const sel = document.getElementById('project-filter');
    sel.innerHTML = '<option value="">All projects</option>' +
      projects.slice(0, 50).map(p =>
        `<option value="${escapeHtml(p.project_slug)}">${escapeHtml(shortenSlug(p.project_slug))} (${p.event_count.toLocaleString()})</option>`
      ).join('');
  } catch (e) { console.error('loadProjects failed:', e); }
}

function renderPersonaFilter() {
  const root = document.getElementById('persona-filter');
  const items = [{ slug: '', label: 'all' }, ...PERSONAS.map(p => ({ slug: p, label: p }))];
  root.innerHTML = items.map(p => {
    const cls = p.slug ? `persona-${personaCls(p.slug) || 'claude'}` : '';
    const active = state.personaFilter === p.slug;
    return `
      <div class="persona-item flex items-center gap-2 px-1 py-0.5 rounded cursor-pointer ${active ? 'bg-surface0' : 'hover:bg-surface0'}" data-persona="${escapeHtml(p.slug)}">
        <span class="persona-rail h-3 ${cls}"></span>
        <span class="${active ? 'text-mauve' : 'text-subtext0'}">${escapeHtml(p.label)}</span>
      </div>
    `;
  }).join('');
  root.querySelectorAll('[data-persona]').forEach(el => {
    el.addEventListener('click', () => {
      state.personaFilter = el.dataset.persona;
      renderPersonaFilter();
      tabRenderers[state.tab]();
    });
  });
}

// ── Wire up ────────────────────────────────────────────────────────

document.querySelectorAll('.view-nav-item[data-tab]').forEach(el => {
  el.addEventListener('click', () => navigate(el.dataset.tab));
});

document.getElementById('project-filter').addEventListener('change', (e) => {
  state.projectSlug = e.target.value;
  tabRenderers[state.tab]();
});

// Mobile sidebar toggle
document.querySelectorAll('[data-action="open-sidebar"]').forEach(el => {
  el.addEventListener('click', () => {
    document.body.classList.add('scrim-open');
    document.getElementById('mobile-scrim').classList.remove('hidden');
  });
});
document.querySelectorAll('[data-action="close-sidebar"]').forEach(el => {
  el.addEventListener('click', () => {
    document.body.classList.remove('scrim-open');
    document.getElementById('mobile-scrim').classList.add('hidden');
  });
});

window.addEventListener('hashchange', () => {
  const tab = parseHash();
  if (tab !== state.tab) navigate(tab);
});

// Show hub-backlink in Mode B (mounted under Platform)
(function showHubBacklinkInModeB() {
  const segs = window.location.pathname.split('/').filter(Boolean);
  if (segs.length > 0 && segs[0] !== 'home') {
    const link = document.getElementById('hub-backlink');
    if (link) link.classList.remove('hidden');
  }
})();

// Boot
(async () => {
  renderPersonaFilter();
  await Promise.all([loadProjects(), refreshStats(), refreshHealthBadge()]);
  navigate(parseHash());
  setInterval(refreshHealthBadge, 30000);
  setInterval(refreshStats, 60000);
})();
</script>
</body>
</html>
