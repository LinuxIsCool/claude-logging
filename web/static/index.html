<script>
'use strict';

const state = {
  tab: 'prompts',
  projectSlug: '',
  prompts: [],
  sessions: [],
  searchResults: null,
  stats: null,
  projects: [],
  currentSession: null,
  transcriptMode: 'clean',
  loading: false,
  error: null,
};

// ── URL helpers ────────────────────────────────────────────────────

function pathPrefix() {
  // Mode A: pathname is "/" or "/index.html" — no prefix.
  // Mode B: pathname starts with "/<mount>/" — prefix is "/<mount>".
  const p = window.location.pathname;
  if (p === '/' || p === '/index.html' || p.startsWith('/?')) return '';
  // Strip trailing slash and trailing /index.html for prefix detection
  const parts = p.split('/').filter(Boolean);
  if (parts.length === 0) return '';
  // First segment is the mount slug if we're in Mode B
  // (claude-webui Platform mounts at /<slug>/)
  return '/' + parts[0];
}

async function api(path, params) {
  const prefix = pathPrefix();
  const url = new URL(prefix + path, window.location.origin);
  if (params) {
    for (const k in params) {
      if (params[k] !== '' && params[k] != null) {
        url.searchParams.set(k, params[k]);
      }
    }
  }
  const res = await fetch(url.toString());
  if (!res.ok) {
    throw new Error(`${path} → HTTP ${res.status}`);
  }
  return await res.json();
}

// ── Rendering helpers ──────────────────────────────────────────────

function fmtTime(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return Math.floor(diff) + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toISOString().slice(0, 10);
  } catch {
    return iso;
  }
}

function fmtAbsTime(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toISOString().replace('T', ' ').slice(0, 19) + 'Z';
  } catch {
    return iso;
  }
}

function personaBadgeClass(persona) {
  if (!persona) return '';
  const known = ['matt', 'shawn', 'darren', 'eve'];
  if (known.includes(persona)) return persona;
  return '';
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function renderPromptCard(p) {
  const persona = p.persona || 'claude';
  const personaCls = `persona-${personaBadgeClass(persona) || 'claude'}`;
  const badgeCls = personaBadgeClass(persona);
  return `
    <div class="card flex animate-fade-in" data-event-id="${escapeHtml(p.event_id)}">
      <div class="persona-rail ${personaCls}"></div>
      <div class="flex-1 p-3">
        <div class="flex items-center gap-2 text-xs mb-2">
          <span class="badge ${badgeCls}">${escapeHtml(persona)}</span>
          <span class="text-overlay1">${escapeHtml(p.project_slug)}</span>
          <span class="text-overlay0" data-age data-iso="${escapeHtml(p.ts)}">${fmtTime(p.ts)}</span>
          ${p.session_id ? `<a class="text-mauve hover:underline cursor-pointer ml-auto" data-session="${escapeHtml(p.session_id)}">transcript →</a>` : ''}
        </div>
        <div class="preview text-sm">${escapeHtml(p.preview || '')}</div>
      </div>
    </div>
  `;
}

function renderEventRow(e) {
  const isPrompt = e.type === 'UserPromptSubmit';
  const isResponse = e.type === 'AssistantResponse';
  const headerColor = isPrompt ? 'text-mauve' : isResponse ? 'text-green' : 'text-sky';
  const content = e.content || (e.data?.response) || (e.data?.prompt) || '';
  return `
    <div class="card p-3 animate-fade-in">
      <div class="flex items-center gap-2 text-xs mb-2">
        <span class="badge ${headerColor}">${escapeHtml(e.type)}</span>
        ${e.persona ? `<span class="badge ${personaBadgeClass(e.persona)}">${escapeHtml(e.persona)}</span>` : ''}
        ${e.tool_name ? `<span class="text-peach">[${escapeHtml(e.tool_name)}]</span>` : ''}
        <span class="text-overlay0 ml-auto" data-age data-iso="${escapeHtml(e.ts)}">${fmtTime(e.ts)}</span>
      </div>
      ${content ? `<div class="preview text-sm">${escapeHtml(content)}</div>` : ''}
    </div>
  `;
}

// ── Tab renderers ──────────────────────────────────────────────────

async function renderPromptsTab() {
  const main = document.getElementById('main');
  main.innerHTML = `<div class="empty">Loading prompts…</div>`;
  try {
    const params = { limit: 50 };
    if (state.projectSlug) params.project_slug = state.projectSlug;
    const prompts = await api('/api/prompts', params);
    state.prompts = prompts;
    if (prompts.length === 0) {
      main.innerHTML = `<div class="empty">No prompts yet${state.projectSlug ? ` in ${state.projectSlug}` : ''}.</div>`;
      return;
    }
    main.innerHTML = `
      <div class="mb-3 text-xs text-subtext0">${prompts.length} most-recent prompts${state.projectSlug ? ` in <span class="text-mauve">${escapeHtml(state.projectSlug)}</span>` : ' across all projects'}</div>
      <div class="space-y-2">
        ${prompts.map(renderPromptCard).join('\n')}
      </div>
    `;
    main.querySelectorAll('[data-session]').forEach(el => {
      el.addEventListener('click', () => {
        state.currentSession = el.dataset.session;
        navigate('transcript');
      });
    });
    main.querySelectorAll('.preview').forEach(el => {
      el.addEventListener('click', () => el.classList.toggle('expanded'));
    });
  } catch (e) {
    main.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
  }
}

async function renderTranscriptTab() {
  const main = document.getElementById('main');
  if (!state.currentSession) {
    // Pick most-recent session from index
    try {
      const sessions = await api('/api/sessions', { limit: 1 });
      if (sessions.length === 0) {
        main.innerHTML = `<div class="empty">No sessions captured.</div>`;
        return;
      }
      state.currentSession = sessions[0].session_id;
    } catch (e) {
      main.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
      return;
    }
  }
  main.innerHTML = `<div class="empty">Loading transcript…</div>`;
  try {
    const t = await api('/api/transcript', {
      session: state.currentSession,
      mode: state.transcriptMode,
    });
    if (t.error) {
      main.innerHTML = `<div class="empty text-red">${escapeHtml(t.error)}</div>`;
      return;
    }
    main.innerHTML = `
      <div class="mb-3 flex items-center gap-3 text-xs">
        <div class="text-subtext0">
          Session <span class="text-mauve font-bold" id="current-session-id">${escapeHtml(t.session_id.slice(0, 8))}…</span>
          in <span class="text-sky">${escapeHtml(t.project_slug)}</span>
          · ${t.event_count} event${t.event_count === 1 ? '' : 's'}
        </div>
        <div class="ml-auto flex gap-1">
          <button class="nav-tab text-xs ${state.transcriptMode==='clean'?'active':''}" data-mode="clean">Clean</button>
          <button class="nav-tab text-xs ${state.transcriptMode==='full'?'active':''}" data-mode="full">Full</button>
        </div>
      </div>
      <div class="space-y-2">
        ${t.events.map(renderEventRow).join('\n')}
      </div>
    `;
    main.querySelectorAll('[data-mode]').forEach(el => {
      el.addEventListener('click', () => {
        state.transcriptMode = el.dataset.mode;
        renderTranscriptTab();
      });
    });
    main.querySelectorAll('.preview').forEach(el => {
      el.addEventListener('click', () => el.classList.toggle('expanded'));
    });
  } catch (e) {
    main.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
  }
}

async function renderSearchTab() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <form id="search-form" class="mb-4 flex gap-2 items-center">
      <input type="text" name="q" placeholder="Search across all logged prompts + events…" class="txt flex-1" autocomplete="off" />
      <select name="mode" class="txt">
        <option value="prompts">Prompts (FTS5)</option>
        <option value="events">All events (FTS5)</option>
      </select>
      <button type="submit" class="nav-tab font-press text-xs px-3 active">Go</button>
    </form>
    <div id="search-results" class="space-y-2"></div>
  `;
  const form = document.getElementById('search-form');
  const resultsEl = document.getElementById('search-results');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const q = fd.get('q');
    const mode = fd.get('mode');
    if (!q) {
      resultsEl.innerHTML = '';
      return;
    }
    resultsEl.innerHTML = `<div class="empty">Searching…</div>`;
    try {
      const r = await api('/api/search', { q, mode });
      state.searchResults = r;
      if (r.results.length === 0) {
        resultsEl.innerHTML = `<div class="empty">No matches for "${escapeHtml(q)}".</div>`;
        return;
      }
      resultsEl.innerHTML = `
        <div class="text-xs text-subtext0 mb-2">${r.results.length} match${r.results.length === 1 ? '' : 'es'} for "${escapeHtml(r.q)}" (${escapeHtml(r.mode)} mode)</div>
        ${r.results.map(renderPromptCard).join('\n')}
      `;
      resultsEl.querySelectorAll('[data-session]').forEach(el => {
        el.addEventListener('click', () => {
          state.currentSession = el.dataset.session;
          navigate('transcript');
        });
      });
      resultsEl.querySelectorAll('.preview').forEach(el => {
        el.addEventListener('click', () => el.classList.toggle('expanded'));
      });
    } catch (e) {
      resultsEl.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
    }
  });
}

async function renderSettingsTab() {
  const main = document.getElementById('main');
  main.innerHTML = `<div class="empty">Loading stats…</div>`;
  try {
    const stats = await api('/api/stats');
    state.stats = stats;
    const types = Object.entries(stats.events_by_type || {});
    main.innerHTML = `
      <div class="space-y-4">
        <div class="card p-4">
          <div class="font-press text-sm text-mauve mb-3">Corpus health</div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
            <div><div class="text-subtext0 text-xs">Prompts</div><div class="text-2xl font-bold text-mauve">${stats.key_metric?.toLocaleString() || 0}</div></div>
            <div><div class="text-subtext0 text-xs">Projects</div><div class="text-2xl font-bold text-sky">${stats.projects?.toLocaleString() || 0}</div></div>
            <div><div class="text-subtext0 text-xs">Sessions</div><div class="text-2xl font-bold text-green">${stats.sessions?.toLocaleString() || 0}</div></div>
            <div><div class="text-subtext0 text-xs">Total events</div><div class="text-2xl font-bold text-teal">${stats.events?.toLocaleString() || 0}</div></div>
          </div>
          ${stats.last_synced_at ? `<div class="mt-3 text-xs text-overlay0">Rollup last synced: <span class="text-subtext0">${escapeHtml(stats.last_synced_at)}</span></div>` : ''}
        </div>

        <div class="card p-4">
          <div class="font-press text-sm text-mauve mb-3">Event-type distribution</div>
          <div class="space-y-1 text-sm">
            ${types.slice(0, 15).map(([t, n]) => {
              const max = types[0][1];
              const pct = (n / max) * 100;
              return `
                <div class="flex items-center gap-2">
                  <div class="w-48 text-subtext0">${escapeHtml(t)}</div>
                  <div class="flex-1 bg-surface0 h-4 rounded overflow-hidden relative">
                    <div class="bg-mauve h-full" style="width: ${pct}%"></div>
                  </div>
                  <div class="text-overlay1 text-xs w-16 text-right">${n.toLocaleString()}</div>
                </div>
              `;
            }).join('\n')}
          </div>
        </div>

        <div class="card p-4">
          <div class="font-press text-sm text-mauve mb-3">About</div>
          <div class="space-y-2 text-xs text-subtext0">
            <div>Plugin: <span class="text-text">claude-logging v2.0.0-pre</span> · task-508 Phase 2</div>
            <div>Namespace: <span class="text-text">legion.claude-logging</span></div>
            <div>Cross-project index: <span class="text-text">~/.claude/local/logging/_index/index.db</span></div>
            <div>Capture pipeline: 25 hook event types · WAL journal · JSONL source-of-truth · SQLite rebuildable</div>
            <div>Cluster role: 8th satellite of claude-webui (Surfacing cluster)</div>
            <div class="pt-2 text-overlay0 italic">Phase 2 ships 4 tabs. Phases 4-9 add Queue (TTS YouTube-style), Live (SSE), Slice (10 charts), Annotations, Pastes, mobile-responsive layout.</div>
          </div>
        </div>
      </div>
    `;
  } catch (e) {
    main.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
  }
}

// ── Navigation ─────────────────────────────────────────────────────

const tabRenderers = {
  prompts: renderPromptsTab,
  transcript: renderTranscriptTab,
  search: renderSearchTab,
  settings: renderSettingsTab,
};

function navigate(tab) {
  if (!tabRenderers[tab]) tab = 'prompts';
  state.tab = tab;
  document.querySelectorAll('.nav-tab[data-tab]').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  const newHash = '#' + tab + (tab === 'transcript' && state.currentSession ? '?session=' + state.currentSession : '');
  if (window.location.hash !== newHash) {
    window.location.hash = newHash;
  }
  tabRenderers[tab]();
}

function parseHash() {
  const hash = window.location.hash.replace(/^#/, '');
  if (!hash) return 'prompts';
  const [tab, query] = hash.split('?');
  if (query) {
    const qp = new URLSearchParams(query);
    if (qp.has('session')) state.currentSession = qp.get('session');
  }
  return tab || 'prompts';
}

// ── Health badge ───────────────────────────────────────────────────

async function refreshHealthBadge() {
  try {
    const r = await fetch(pathPrefix() + '/healthz');
    const j = await r.json();
    const slot = document.getElementById('healthz-slot');
    if (j.ok) {
      slot.innerHTML = `<span class="text-green" title="healthz ok · ${j.elapsed_ms}ms">●</span>`;
    } else {
      slot.innerHTML = `<span class="text-red" title="${escapeHtml((j.issues || []).join(' · '))}">●</span>`;
    }
    document.getElementById('footer-status').textContent =
      `${(j.stats?.key_metric || 0).toLocaleString()} events · ${j.stats?.projects || 0} projects`;
  } catch (e) {
    const slot = document.getElementById('healthz-slot');
    slot.innerHTML = `<span class="text-red">●</span>`;
  }
}

// ── Project filter ─────────────────────────────────────────────────

async function loadProjects() {
  try {
    const projects = await api('/api/projects');
    state.projects = projects;
    const sel = document.getElementById('project-filter');
    sel.innerHTML = '<option value="">All projects</option>' +
      projects.map(p =>
        `<option value="${escapeHtml(p.project_slug)}">${escapeHtml(p.project_slug)} (${p.event_count.toLocaleString()})</option>`
      ).join('');
  } catch (e) {
    console.error('loadProjects failed:', e);
  }
}

// ── Wire up ────────────────────────────────────────────────────────

document.querySelectorAll('.nav-tab[data-tab]').forEach(el => {
  el.addEventListener('click', () => navigate(el.dataset.tab));
});

document.getElementById('project-filter').addEventListener('change', (e) => {
  state.projectSlug = e.target.value;
  tabRenderers[state.tab]();
});

window.addEventListener('hashchange', () => {
  const tab = parseHash();
  if (tab !== state.tab) navigate(tab);
});

// Boot
(async () => {
  await Promise.all([loadProjects(), refreshHealthBadge()]);
  navigate(parseHash());
  // Refresh health every 30s
  setInterval(refreshHealthBadge, 30000);
})();
</script>
