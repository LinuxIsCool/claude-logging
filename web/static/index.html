<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>claude-logging — Legion observability</title>
<link rel="icon" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="%231e1e2e"/><text x="50%25" y="62%25" text-anchor="middle" font-size="20" fill="%23cba6f7" font-family="monospace">%E2%97%89</text></svg>' />
<!-- Precompiled Tailwind (task-4114): replaces the Play CDN (cdn.tailwindcss.com),
     which compiled utilities in-browser on every load (~2s) and required network.
     Rebuild: web/.twbuild/ → `npx tailwindcss@3 -c .twbuild/tailwind.config.js -i .twbuild/input.css -o static/tailwind.css --minify` -->
<link rel="stylesheet" href="static/tailwind.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulseGlow { 0% { box-shadow: 0 0 0 1px rgba(203,166,247,0.8); } 100% { box-shadow: 0 0 0 1px transparent; } }
  body { font-family: 'JetBrains Mono', monospace; background: #1e1e2e; color: #cdd6f4; }
  .font-pixel { font-family: 'Press Start 2P', monospace; letter-spacing: 0.04em; }
  /* Line-clamp fallback (works regardless of Tailwind build coverage) */
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* Persona color rails (3-px left border on cards) */
  .persona-rail { width: 3px; flex-shrink: 0; }
  .persona-matt { background: #cba6f7; }
  .persona-shawn { background: #89b4fa; }
  .persona-darren { background: #94e2d5; }
  .persona-eve { background: #f5c2e7; }
  .persona-claude { background: #6c7086; }
  /* Card surface */
  .card { background: #181825; border: 1px solid #313244; border-radius: 6px; transition: border-color 0.15s; }
  .card:hover { border-color: #45475a; }
  /* View-nav item */
  .view-nav-item {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.5rem 0.75rem; border-radius: 4px;
    cursor: pointer; font-family: 'Press Start 2P', monospace;
    font-size: 0.65rem; letter-spacing: 0.04em;
    color: #a6adc8; transition: all 0.15s;
  }
  .view-nav-item:hover { background: rgba(203,166,247,0.08); color: #b4befe; }
  .view-nav-item.active { background: rgba(203,166,247,0.15); color: #cba6f7; }
  .view-nav-item .glyph { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; opacity: 0.7; }
  .view-nav-item.active .glyph { opacity: 1; }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #1e1e2e; }
  ::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #585b70; }
  /* Preview clamping */
  .preview { white-space: pre-wrap; word-wrap: break-word; max-height: 6rem; overflow: hidden; position: relative; }
  .preview::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 1.5rem; background: linear-gradient(transparent, #181825); pointer-events: none;
  }
  .preview.expanded { max-height: 28rem; overflow-y: auto; }
  .preview.expanded::after { display: none; }
  /* Search keyword highlight (ported from claude-plugins3 v3 search-context) */
  mark { background: rgba(249,226,175,0.28); color: #f9e2af; border-radius: 2px; padding: 0 1px; }

  /* ── Epic cards (design ported from legion storybook UniversalCard) ── */
  .ecard {
    --accent: #cba6f7;
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    border-left: 3px solid var(--accent);
    border-radius: 12px; background: #181825; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    transition: transform 0.12s, box-shadow 0.12s; cursor: pointer;
  }
  .ecard:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.5), 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
  .ecard.selected {
    border-left-width: 5px;
    background: color-mix(in srgb, var(--accent) 12%, #181825);
    box-shadow: 0 0 0 2px var(--accent), 0 0 18px 2px color-mix(in srgb, var(--accent) 45%, transparent), 0 2px 8px rgba(0,0,0,0.5);
  }
  .ecard.selected .ecard-head { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 32%, transparent), color-mix(in srgb, var(--accent) 12%, transparent)); }
  /* The focused transcript event (session's prompt / clicked prompt) — loud + unmistakable */
  .ecard.tx-focus {
    border: 2px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 20%, #181825);
    box-shadow: 0 0 0 3px var(--accent), 0 0 26px 5px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .ecard.tx-focus .ecard-title, .ecard.tx-focus .ecard-body { color: #f1f5f9; }
  .ecard.tx-focus .ecard-head::before { content: '▶ '; color: var(--accent); font-weight: 700; }
  .ecard-head {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    padding: 0.5rem 0.75rem;
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, transparent), color-mix(in srgb, var(--accent) 5%, transparent));
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
  }
  .ecard-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  /* Prominent timestamp */
  .ecard-ts { margin-left: auto; font-size: 0.95rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .ecard-ts .ago { font-size: 0.7rem; font-weight: 400; color: #7f849c; margin-left: 0.4rem; }
  .ecard-title { padding: 0.6rem 0.75rem 0.1rem; font-size: 1rem; font-weight: 700; color: #f1f5f9; line-height: 1.3; }
  /* Full content — no truncation; scroll within a bounded viewport */
  .ecard-body {
    padding: 0.4rem 0.75rem 0.6rem; font-size: 0.85rem; color: #cdd6f4;
    line-height: 1.55; white-space: pre-wrap; word-break: break-word;
    font-family: 'JetBrains Mono', monospace;
    max-height: 26rem; overflow-y: auto;
  }
  .ecard-foot {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    padding: 0.45rem 0.75rem; border-top: 1px solid #313244; font-size: 0.7rem; color: #7f849c;
  }
  .chip { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.1rem 0.5rem; border-radius: 9999px; background: #313244; color: #a6adc8; font-size: 0.7rem; }
  .chip-accent { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  /* Toolbar (per-view search/filter/sort) */
  .toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; padding: 0.6rem; border: 1px solid #313244; border-radius: 10px; background: #181825; }
  .sortbtn { font-size: 0.75rem; padding: 0.3rem 0.6rem; border-radius: 6px; border: 1px solid #313244; background: #1e1e2e; color: #a6adc8; cursor: pointer; }
  .sortbtn.active { border-color: color-mix(in srgb, #cba6f7 60%, transparent); background: rgba(203,166,247,0.12); color: #cba6f7; }
  /* Inputs */
  input.txt, select.txt {
    background: #1e1e2e; border: 1px solid #313244; color: #cdd6f4;
    padding: 0.4rem 0.6rem; border-radius: 4px; outline: none;
    font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
  }
  input.txt:focus, select.txt:focus { border-color: #cba6f7; }
  /* Badge */
  .badge {
    display: inline-block; padding: 0.125rem 0.5rem; border-radius: 9999px;
    font-size: 0.7rem; font-weight: 500; background: #313244; color: #a6adc8;
  }
  .badge.matt { background: rgba(203,166,247,0.15); color: #cba6f7; }
  .badge.shawn { background: rgba(137,180,250,0.15); color: #89b4fa; }
  .badge.darren { background: rgba(148,226,213,0.15); color: #94e2d5; }
  .badge.eve { background: rgba(245,194,231,0.15); color: #f5c2e7; }
  .badge-tool { background: rgba(250,179,135,0.15); color: #fab387; }
  /* Empty state */
  .empty { padding: 4rem 2rem; text-align: center; color: #6c7086; }
  /* Live pulse on freshly arrived elements */
  .live-pulse { animation: pulseGlow 0.8s ease-out; }
  /* Mobile sidebar */
  .scrim-open #left-nav { transform: translateX(0); }
  @media (max-width: 1024px) {
    #left-nav { position: fixed; left: 0; top: 0; bottom: 0; width: 240px;
                transform: translateX(-100%); transition: transform 0.2s ease;
                z-index: 50; background: #181825; padding: 1rem; overflow-y: auto; }
    #detail-panel { display: none; }
  }
</style>

<script src="static/embedded-bar.js"></script>

<script>
'use strict';

const PERSONAS = ['matt', 'shawn', 'darren', 'eve', 'legion'];

const state = {
  tab: 'sessions',
  projectSlug: '',
  highlightQuery: '',
  sessionsSort: 'ended_at', sessionsOrder: 'desc', sessionsQ: '',
  promptsSort: 'ts', promptsOrder: 'desc', promptsQ: '', promptsAuthor: 'human',
  txQ: '', txTypeFilter: '', txOrder: 'desc', txScopeAll: false, txFocusEventId: null,
  eventsQ: '', eventsType: '', eventsSort: 'ts', eventsOrder: 'desc',
  projectsSort: 'recent',
  sessions: [],
  prompts: [],
  searchResults: null,
  stats: null,
  projects: [],
  currentSession: null,
  currentPromptDetail: null,
  transcriptMode: 'clean',
};

// ── URL / path helpers ─────────────────────────────────────────────

function pathPrefix() {
  const p = window.location.pathname;
  if (p === '/' || p === '/index.html' || p.startsWith('/?')) return '';
  const parts = p.split('/').filter(Boolean);
  if (parts.length === 0) return '';
  return '/' + parts[0];
}

async function api(path, params) {
  const prefix = pathPrefix();
  const url = new URL(prefix + path, window.location.origin);
  if (params) {
    for (const k in params) {
      if (params[k] !== '' && params[k] != null) {
        url.searchParams.set(k, params[k]);
      }
    }
  }
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error(`${path} → HTTP ${res.status}`);
  return await res.json();
}

// ── Rendering helpers ──────────────────────────────────────────────

function fmtTime(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    const diff = (Date.now() - d) / 1000;
    if (diff < 60) return Math.floor(diff) + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toISOString().slice(0, 10);
  } catch { return iso; }
}

function personaCls(persona) {
  if (!persona) return '';
  return PERSONAS.includes(persona) ? persona : '';
}

// Prominent clock (HH:MM, local) for the big timestamp on epic cards.
function fmtClock(iso) {
  if (!iso) return '';
  try { const d = new Date(iso); if (isNaN(d)) return '';
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch { return ''; }
}
// Full local datetime for card footers.
function fmtFullDate(iso) {
  if (!iso) return '';
  try { const d = new Date(iso); if (isNaN(d)) return iso;
    return d.toLocaleString([], { year:'numeric', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
  } catch { return iso; }
}

// Event-type glyphs — fast visual scan of a transcript (Phase 2).
// Restrained, safe-width emoji set (per claude-emoji study, task-4114):
// drops ambiguous-width chars (✅❌☑️⏹️), confusing ones (🧵🧶), and uses a
// muted typographic glyph (›) for housekeeping meta-events to cut visual noise.
const EVENT_GLYPH = {
  UserPromptSubmit: '📩', AssistantResponse: '🗨️',
  PreToolUse: '🔧', PostToolUse: '✔', PostToolUseFailure: '✘',
  SubagentStart: '🚀', SubagentStop: '🛬', Stop: '🏁', StopFailure: '🚨',
  SessionStart: '🌅', SessionEnd: '🌆', Notification: '🔔',
  PermissionRequest: '🔐', TaskCreated: '📌', TaskCompleted: '✔',
  PreCompact: '🗜️',
  InstructionsLoaded: '›', CwdChanged: '›', ConfigChange: '›', PostCompact: '›',
};
function eventGlyph(type) { return EVENT_GLYPH[type] || '›'; }

// Per-session colour — stable hash of session_id → Catppuccin accent palette.
// Sessions are colour-coded; prompts inherit their session's colour.
const SESSION_PALETTE = [
  '#cba6f7','#89b4fa','#94e2d5','#f5c2e7','#fab387','#a6e3a1','#89dceb',
  '#b4befe','#f38ba8','#f9e2af','#74c7ec','#eba0ac','#f2cdcd','#f5e0dc',
];
function sessionColor(id) {
  if (!id) return '#6c7086';
  let h = 0;
  for (let i = 0; i < id.length; i++) { h = ((h << 5) - h + id.charCodeAt(i)) | 0; }
  return SESSION_PALETTE[Math.abs(h) % SESSION_PALETTE.length];
}

// Keyword highlighting (ported from claude-plugins3 v3: search-context.tsx +
// highlighted-text.tsx). Escape first, then wrap query terms in <mark> on the
// already-escaped string so it's injection-safe inside innerHTML templates.
function regexEscape(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function highlightEscaped(text, query) {
  const esc = escapeHtml(text || '');
  const q = (query || '').trim();
  if (!q) return esc;
  // Limit to 20 terms (DoS guard, per v3); escape for HTML then for regex so
  // patterns line up with the escaped haystack.
  const words = q.toLowerCase().split(/\s+/).filter(Boolean).slice(0, 20)
    .map(w => regexEscape(escapeHtml(w)));
  if (!words.length) return esc;
  try {
    return esc.replace(new RegExp('(' + words.join('|') + ')', 'gi'), '<mark>$1</mark>');
  } catch { return esc; }
}

// Compact duration between two ISO timestamps, e.g. "12m", "3h 5m", "2d".
function fmtDuration(startIso, endIso) {
  if (!startIso || !endIso) return '';
  try {
    const secs = Math.max(0, (new Date(endIso) - new Date(startIso)) / 1000);
    if (secs < 60) return Math.round(secs) + 's';
    if (secs < 3600) return Math.round(secs / 60) + 'm';
    if (secs < 86400) {
      const h = Math.floor(secs / 3600), m = Math.round((secs % 3600) / 60);
      return m ? `${h}h ${m}m` : `${h}h`;
    }
    return Math.round(secs / 86400) + 'd';
  } catch { return ''; }
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
}

function shortenSlug(slug) {
  if (!slug) return '';
  // -home-shawn-legion-koi → legion-koi
  // -home-shawn-.claude-plugins-local-legion-plugins-plugins-claude-X → plugins/claude-X
  if (slug.includes('-plugins-local-legion-plugins-plugins-')) {
    const m = slug.match(/-plugins-local-legion-plugins-plugins-(.+)$/);
    if (m) return 'plugins/' + m[1];
  }
  if (slug.startsWith('-home-shawn-')) {
    return slug.replace('-home-shawn-', '');
  }
  return slug;
}

// ── Cards ──────────────────────────────────────────────────────────

// Prompt card — coloured by its session (sessionColor), prominent timestamp,
// full content (no truncation; scrolls inside .ecard-body). Click → open the
// session transcript.
function renderPromptCard(p) {
  const accent = sessionColor(p.session_id);
  const author = p.author === 'agent'
    ? '<span class="badge" style="background:rgba(250,179,135,0.18);color:#fab387">🤖 agent</span>'
    : '<span class="badge" style="background:rgba(166,227,161,0.18);color:#a6e3a1">👤 you</span>';
  return `
    <div class="ecard animate-fade-in mb-3" style="--accent:${accent}" data-event-id="${escapeHtml(p.event_id)}" data-session="${escapeHtml(p.session_id || '')}">
      <div class="ecard-head">
        <span class="ecard-dot"></span>
        ${author}
        <span class="chip" title="${escapeHtml(p.project_slug)}">${escapeHtml(shortenSlug(p.project_slug))}</span>
        <span class="ecard-ts">${fmtClock(p.ts)}<span class="ago" data-age data-iso="${escapeHtml(p.ts)}">${fmtTime(p.ts)}</span></span>
      </div>
      <div class="ecard-body">${highlightEscaped(p.preview || '', state.highlightQuery)}</div>
      <div class="ecard-foot">
        <span class="chip chip-accent" title="session">${escapeHtml((p.session_id || '').slice(0,8))}</span>
        <span>${fmtFullDate(p.ts)}</span>
      </div>
    </div>
  `;
}

function renderEventRow(e, accent) {
  const content = e.content || (e.data?.response) || (e.data?.prompt) || '';
  const a = accent || sessionColor(e.session_id || state.currentSession);
  return `
    <div class="ecard animate-fade-in mb-3" style="--accent:${a}" data-session="${escapeHtml(e.session_id || '')}" data-event-id="${escapeHtml(e.event_id || '')}">
      <div class="ecard-head">
        <span class="ecard-dot"></span>
        <span class="badge">${eventGlyph(e.type)} ${escapeHtml(e.type)}</span>
        ${e.tool_name ? `<span class="chip">🔧 ${escapeHtml(e.tool_name)}</span>` : ''}
        ${e.project_slug ? `<span class="chip" title="${escapeHtml(e.project_slug)}">${escapeHtml(shortenSlug(e.project_slug))}</span>` : ''}
        <span class="ecard-ts">${fmtClock(e.ts)}<span class="ago" data-age data-iso="${escapeHtml(e.ts)}">${fmtTime(e.ts)}</span></span>
      </div>
      ${content ? `<div class="ecard-body">${highlightEscaped(content, state.highlightQuery || state.txQ)}</div>` : ''}
      <div class="ecard-foot"><span>${fmtFullDate(e.ts)}</span></div>
    </div>
  `;
}

// Reusable sort-control builder: [{key,label}], current sort/order, data-attr group.
function sortControls(cols, curSort, curOrder, group) {
  return cols.map(c => {
    const active = c.key === curSort;
    const arrow = active ? (curOrder === 'asc' ? '↑' : '↓') : '';
    return `<button class="sortbtn ${active ? 'active' : ''}" data-sort-group="${group}" data-sort="${c.key}">${escapeHtml(c.label)} ${arrow}</button>`;
  }).join('');
}

async function renderPromptsTab() {
  const main = document.getElementById('view-root');

      <span class="text-overlay0 text-xs">author:</span>
      <button class="sortbtn ${state.promptsAuthor==='human'?'active':''}" data-author="human">👤 mine</button>
      <button class="sortbtn ${state.promptsAuthor==='agent'?'active':''}" data-author="agent">🤖 agent</button>
      <button class="sortbtn ${state.promptsAuthor==='both'?'active':''}" data-author="both">both</button>
      <span class="text-overlay0 text-xs">sort:</span>
      ${sortControls([{key:'ts',label:'time'},{key:'project_slug',label:'project'},{key:'session_id',label:'session'}], state.promptsSort, state.promptsOrder, 'prompts')}
    </div>
    <div id="prompts-list" class="empty">Loading…</div>
  `;
  main.querySelectorAll('[data-author]').forEach(el => el.addEventListener('click', () => {

    else { state.promptsSort = k; state.promptsOrder = 'desc'; }
    renderPromptsTab();

  await loadPrompts();

async function loadPrompts() {
  const list = document.getElementById('prompts-list');
  const q = state.promptsQ;
  state.highlightQuery = q || '';
  try {
    const params = { limit: 50, sort: state.promptsSort, order: state.promptsOrder, author: state.promptsAuthor };
    if (state.projectSlug) params.project_slug = state.projectSlug;
    if (q) params.q = q;
    const prompts = await api('/api/prompts', params);
    state.prompts = prompts;
    if (prompts.length === 0) {
      list.innerHTML = `<div class="empty">No prompts found.</div>`;
      return;
    }
    list.innerHTML = prompts.map(renderPromptCard).join('\n');
    wireCards(list);
  } catch (e) {
    list.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
  }
}

// Click a prompt card → open its session transcript in the right detail panel.
function wireCards(root) {
  root.querySelectorAll('[data-event-id]').forEach(el => {
    el.addEventListener('click', () => {
      const sid = el.dataset.session;
      if (sid) openTranscriptPanel(sid, el.dataset.eventId);
    });
  });
}

// Event-type filter <select> options (from glyph map).
function typeOptions(selected) {
  const opts = ['<option value="">all types</option>']
    .concat(Object.keys(EVENT_GLYPH).map(t =>
      `<option value="${t}" ${t === selected ? 'selected' : ''}>${eventGlyph(t)} ${t}</option>`));
  return opts.join('');
}

// Open a session's transcript in the RIGHT detail panel (list stays in main).
// focusEventId (optional) → that event is highlighted + scrolled to in the panel.
function openTranscriptPanel(sessionId, focusEventId) {
  if (sessionId) state.currentSession = sessionId;
  state.txFocusEventId = focusEventId || null;
  // Open a session chronologically (oldest→top) so its first prompt — the card
  // title — sits at the TOP and is highlighted there (Shawn's choice). The in-panel
  // time toggle still flips to newest-first. Cross-transcript scope reset off.
  state.txScopeAll = false;
  state.txOrder = 'asc';
  // mark the selected card in the LIST (left)
  document.querySelectorAll('#view-root .ecard.selected').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll(`#view-root [data-session-open="${sessionId}"], #view-root [data-event-id="${focusEventId||'__none__'}"]`).forEach(el => el.classList.add('selected'));
  renderTranscriptPanel();
}

function resetDetailPanel() {
  const slot = document.getElementById('detail-slot');

// Open a project's sessions in the RIGHT detail panel, reverse-chrono by most

async function openProjectPanel(slug) {
  const slot = document.getElementById('detail-slot');
  if (!slot) return;
  document.querySelectorAll('#view-root .ecard.selected').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll(`#view-root [data-project-open="${slug}"]`).forEach(el => el.classList.add('selected'));
  const accent = sessionColor(slug);
  slot.innerHTML = `
    <div class="flex items-center gap-2 mb-3 text-xs">
      <span class="ecard-dot" style="--accent:${accent}; background:${accent}"></span>
      <span class="text-subtext0">${escapeHtml(shortenSlug(slug))}</span>

function renderTranscriptPanel() {
  const slot = document.getElementById('detail-slot');
  if (!slot) return;

  state.highlightQuery = state.txQ || '';
  slot.innerHTML = `

      <button class="sortbtn ${state.txOrder==='asc'?'active':''}" data-action="tx-order">time ${state.txOrder==='asc'?'↑':'↓'}</button>
      <button class="sortbtn ${state.txScopeAll?'active':''}" data-action="tx-scope">${state.txScopeAll ? '◉ all' : '○ this'}</button>
      ${state.txScopeAll ? '' : `<button class="sortbtn ${state.transcriptMode==='clean'?'active':''}" data-mode="clean">clean</button><button class="sortbtn ${state.transcriptMode==='full'?'active':''}" data-mode="full">full</button>`}
    </div>
    <div id="tx-list" class="empty">Loading…</div>
  `;
  slot.querySelector('#tx-q').addEventListener('input', (e) => {
    clearTimeout(window._txDebounce);
    window._txDebounce = setTimeout(() => { state.txQ = e.target.value; loadTranscript(); }, 250);
  });
  slot.querySelector('#tx-type').addEventListener('change', (e) => { state.txTypeFilter = e.target.value; loadTranscript(); });
  slot.querySelector('[data-action="tx-close"]').addEventListener('click', () => {
    document.querySelectorAll('.ecard.selected').forEach(el => el.classList.remove('selected'));
    resetDetailPanel();
  });
  slot.querySelector('[data-action="tx-order"]').addEventListener('click', () => { state.txOrder = state.txOrder==='asc'?'desc':'asc'; loadTranscript(); });
  slot.querySelector('[data-action="tx-scope"]').addEventListener('click', () => { state.txScopeAll = !state.txScopeAll; renderTranscriptPanel(); });
  slot.querySelectorAll('[data-mode]').forEach(el => el.addEventListener('click', () => { state.transcriptMode = el.dataset.mode; loadTranscript(); }));
  loadTranscript();
}

async function loadTranscript() {
  const list = document.getElementById('tx-list');
  if (!list) return;
  const accent = sessionColor(state.currentSession);
  try {
    let events, header;
    if (state.txScopeAll) {
      // Cross-transcript: search/filter/sort ALL events corpus-wide.
      const params = { limit: 200, sort: 'ts', order: state.txOrder };
      if (state.txQ) params.q = state.txQ;
      if (state.txTypeFilter) params.types = state.txTypeFilter;
      if (state.projectSlug) params.project_slug = state.projectSlug;
      const rows = await api('/api/events', params);
      events = rows.map(r => ({ event_id: r.event_id, type: r.type, ts: r.ts, content: r.preview, session_id: r.session_id, project_slug: r.project_slug }));
      header = `${events.length} event${events.length===1?'':'s'} across all transcripts${state.txQ?` matching "${escapeHtml(state.txQ)}"`:''}`;
    } else {
      const t = await api('/api/transcript', { session: state.currentSession, mode: state.transcriptMode });
      if (t.error) { list.innerHTML = `<div class="empty text-red">${escapeHtml(t.error)}</div>`; return; }
      events = t.events;
      // client-side filter (text + type) within the session
      if (state.txTypeFilter) events = events.filter(e => e.type === state.txTypeFilter);
      if (state.txQ) { const q = state.txQ.toLowerCase(); events = events.filter(e => (e.content||'').toLowerCase().includes(q)); }
      if (state.txOrder === 'desc') events = events.slice().reverse();
      const proj = (t.project_slugs && t.project_slugs.length > 1) ? `${t.project_slugs.length} projects` : shortenSlug(t.project_slug);
      header = `Session <code style="color:${accent}">${escapeHtml((t.session_id||'').slice(0,8))}…</code> in <span class="text-sky">${escapeHtml(proj)}</span> · ${events.length}/${t.event_count} event${t.event_count===1?'':'s'}`;
    }
    if (!events.length) { list.innerHTML = `<div class="empty">No events match.</div>`; return; }
    list.innerHTML = `<div class="text-xs text-subtext0 mb-3">${header}</div>` +
      events.map(e => renderEventRow(e, state.txScopeAll ? sessionColor(e.session_id) : accent)).join('\n');
    // Highlight + scroll to the focused event (e.g. the prompt that was clicked).
    if (state.txFocusEventId) {
      const target = list.querySelector(`[data-event-id="${state.txFocusEventId}"]`);
      if (target) {
        target.classList.add('tx-focus');
        target.scrollIntoView({ block: 'center' });
      }
    }
  } catch (e) {
    list.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
  }
}

// Derive a clean title from the first-prompt content_preview (which may
// carry hook boilerplate, leading dashes, or command caveats).
function sessionTitle(s) {
  let t = (s.title || '').trim();
  t = t.replace(/^-+\s*/, '').trim().replace(/\s+/g, ' ');
  if (!t) return `session ${(s.session_id || '').slice(0, 8)}`;
  return t;  // no truncation — full title
}

function renderSessionCard(s) {
  const title = sessionTitle(s);
  const dur = fmtDuration(s.started_at, s.ended_at);
  const accent = sessionColor(s.session_id);
  return `
    <div class="ecard animate-fade-in mb-3" style="--accent:${accent}" data-session-open="${escapeHtml(s.session_id || '')}" data-title-event="${escapeHtml(s.title_event_id || '')}">
      <div class="ecard-head">
        <span class="ecard-dot"></span>
        <span class="chip" title="${escapeHtml(s.project_slug || '')}">${escapeHtml(shortenSlug(s.project_slug))}</span>
        <span class="ecard-ts" title="last activity">${fmtClock(s.ended_at)}<span class="ago" data-age data-iso="${escapeHtml(s.ended_at)}">${fmtTime(s.ended_at)}</span></span>
      </div>
      <div class="ecard-title">${highlightEscaped(title, state.sessionsQ)}</div>
      <div class="ecard-foot">
        <span class="chip chip-accent">${escapeHtml((s.session_id || '').slice(0,8))}</span>
        <span>${s.prompt_count || 0} prompts</span>
        <span>${(s.event_count || 0).toLocaleString()} events</span>
        ${dur ? `<span>${dur}</span>` : ''}
        <span class="ml-auto text-overlay0">started ${fmtFullDate(s.started_at)} · last ${fmtClock(s.ended_at)}</span>
      </div>
    </div>
  `;
}

async function loadSessions() {
  const list = document.getElementById('sessions-list');
  state.highlightQuery = state.sessionsQ || '';
  try {
    // Server sorts; load a wider set so the client-side title/id filter is useful.
    const params = { limit: state.sessionsQ ? 300 : 50, sort: state.sessionsSort, order: state.sessionsOrder };
    if (state.projectSlug) params.project_slug = state.projectSlug;
    let sessions = await api('/api/sessions', params);
    if (state.sessionsQ) {
      const q = state.sessionsQ.toLowerCase();
      sessions = sessions.filter(s => (sessionTitle(s)).toLowerCase().includes(q) || (s.session_id||'').toLowerCase().includes(q));
    }
    state.sessions = sessions;
    if (!sessions.length) { list.innerHTML = `<div class="empty">No sessions found.</div>`; return; }
    list.innerHTML = sessions.map(renderSessionCard).join('\n');
    list.querySelectorAll('[data-session-open]').forEach(el => el.addEventListener('click', () => {
      openTranscriptPanel(el.dataset.sessionOpen, el.dataset.titleEvent || null);
    }));
  } catch (e) {
    list.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
  }
}

        <span class="ecard-dot"></span>
        <span class="badge">project</span>
        <span class="ecard-ts">${(p.event_count||0).toLocaleString()}<span class="ago">events</span></span>
      </div>
      <div class="ecard-title">${escapeHtml(shortenSlug(p.project_slug))}</div>
      <div class="ecard-foot">
        <span class="chip" title="${escapeHtml(p.project_slug)}">${escapeHtml(p.project_slug)}</span>
        <span class="ml-auto">last: ${escapeHtml(fmtFullDate(p.last_event_ts))}</span>
      </div>
    </div>
  `;
}

async function renderProjectsTab() {
  const main = document.getElementById('view-root');
  state.highlightQuery = '';
  main.innerHTML = `
    <div class="toolbar">
      <span class="text-overlay0 text-xs">sort:</span>
      <button class="sortbtn ${state.projectsSort==='recent'?'active':''}" data-psort="recent">recent</button>
      <button class="sortbtn ${state.projectsSort==='events'?'active':''}" data-psort="events">events</button>
      <button class="sortbtn ${state.projectsSort==='name'?'active':''}" data-psort="name">name</button>
    </div>
    <div id="projects-list" class="empty">Loading…</div>
  `;
  main.querySelectorAll('[data-psort]').forEach(el => el.addEventListener('click', () => { state.projectsSort = el.dataset.psort; renderProjectsTab(); }));
  const list = document.getElementById('projects-list');
  try {
    let projects = await api('/api/projects');
    if (state.projectsSort === 'events') projects = projects.slice().sort((a,b) => (b.event_count||0)-(a.event_count||0));
    else if (state.projectsSort === 'name') projects = projects.slice().sort((a,b) => (a.project_slug||'').localeCompare(b.project_slug||''));
    // 'recent' = backend default (last_event_ts desc)
    if (!projects.length) { list.innerHTML = `<div class="empty">No projects found.</div>`; return; }
    list.innerHTML = `<div class="text-xs text-subtext0 mb-3">${projects.length} projects</div>` + projects.map(renderProjectCard).join('\n');
    list.querySelectorAll('[data-project-open]').forEach(el => el.addEventListener('click', () => {
      openProjectPanel(el.dataset.projectOpen);
    }));
  } catch (e) {
    list.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
  }
}

// ── Navigation ─────────────────────────────────────────────────────

const tabRenderers = {
  sessions: renderSessionsTab,
  prompts: renderPromptsTab,
  events: renderEventsTab,
  projects: renderProjectsTab,
  stats: renderSettingsTab,
};
// Transcript is NOT a tab — it opens in the right detail panel via openTranscriptPanel().

function navigate(tab) {
  if (!tabRenderers[tab]) tab = 'sessions';
  state.tab = tab;
  document.querySelectorAll('.view-nav-item[data-tab]').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  const newHash = '#' + tab;
  if (window.location.hash !== newHash) window.location.hash = newHash;
  tabRenderers[tab]();
  // Close mobile sidebar on nav
  document.body.classList.remove('scrim-open');
  document.getElementById('mobile-scrim').classList.add('hidden');
}

function parseHash() {
  const hash = window.location.hash.replace(/^#/, '');
  if (!hash) return 'sessions';
  const [tab, query] = hash.split('?');
  if (query) {
    const qp = new URLSearchParams(query);
    if (qp.has('session')) state.currentSession = qp.get('session');
  }
  // Legacy #transcript?session= deep link → list view + open panel after boot.
  if (tab === 'transcript') {
    if (state.currentSession) setTimeout(() => openTranscriptPanel(state.currentSession), 0);
    return 'sessions';
  }
  if (!tabRenderers[tab]) return 'sessions';
  return tab;
}

// ── Stats / health / projects boot ─────────────────────────────────

async function refreshStats() {
  try {
    const s = await api('/api/stats');
    state.stats = s;
    document.getElementById('stat-prompts').textContent = (s.key_metric || 0).toLocaleString();
    document.getElementById('stat-events').textContent = (s.events || 0).toLocaleString();
    document.getElementById('stat-projects').textContent = (s.projects || 0).toLocaleString();
    document.getElementById('stat-sessions').textContent = (s.sessions || 0).toLocaleString();
  } catch (e) {
    console.error('stats failed:', e);
  }
}

async function refreshHealthBadge() {
  try {
    const r = await fetch(pathPrefix() + '/healthz');
    const j = await r.json();
    const slot = document.getElementById('healthz-slot');
    if (j.ok) {
      slot.innerHTML = `<span class="text-green" title="healthz ok · ${j.elapsed_ms}ms">●</span>`;
    } else {
      slot.innerHTML = `<span class="text-red" title="${escapeHtml((j.issues || []).join(' · '))}">●</span>`;
    }
    document.getElementById('footer-status').textContent = `${(j.stats?.key_metric || 0).toLocaleString()} events · ${j.stats?.projects || 0} projects`;
  } catch (e) {
    document.getElementById('healthz-slot').innerHTML = `<span class="text-red">●</span>`;
  }
}

async function loadProjects() {
  try {
    const projects = await api('/api/projects');
    state.projects = projects;
    const sel = document.getElementById('project-filter');
    sel.innerHTML = '<option value="">All projects</option>' +
      projects.slice(0, 50).map(p =>
        `<option value="${escapeHtml(p.project_slug)}">${escapeHtml(shortenSlug(p.project_slug))} (${p.event_count.toLocaleString()})</option>`
      ).join('');
  } catch (e) { console.error('loadProjects failed:', e); }
}


// ── Wire up ────────────────────────────────────────────────────────

document.querySelectorAll('.view-nav-item[data-tab]').forEach(el => {
  el.addEventListener('click', () => navigate(el.dataset.tab));
});

document.getElementById('project-filter').addEventListener('change', (e) => {
  state.projectSlug = e.target.value;
  tabRenderers[state.tab]();
});

// Mobile sidebar toggle
document.querySelectorAll('[data-action="open-sidebar"]').forEach(el => {
  el.addEventListener('click', () => {
    document.body.classList.add('scrim-open');
    document.getElementById('mobile-scrim').classList.remove('hidden');
  });
});
document.querySelectorAll('[data-action="close-sidebar"]').forEach(el => {
  el.addEventListener('click', () => {
    document.body.classList.remove('scrim-open');
    document.getElementById('mobile-scrim').classList.add('hidden');
  });
});

window.addEventListener('hashchange', () => {
  const tab = parseHash();
  if (tab !== state.tab) navigate(tab);
});

// Show hub-backlink in Mode B (mounted under Platform)
(function showHubBacklinkInModeB() {
  const segs = window.location.pathname.split('/').filter(Boolean);
  if (segs.length > 0 && segs[0] !== 'home') {
    const link = document.getElementById('hub-backlink');
    if (link) link.classList.remove('hidden');
  }
})();

// ── Real-time push (task-534 Phase 2) ──────────────────────────────
//
// Subscribes to /api/events SSE on the kernel. On every corpus-changed
// payload (push by the rollup_daemon via signature_fn polling at 200ms),
// re-render the currently visible tab. Falls back to a 15s polling refresh
// when the stream disconnects. live-slot dot reflects current state.

const liveSlot = document.getElementById('live-slot');
function setLiveDot(color, title) {
  liveSlot.className = `text-xs text-${color}`;
  liveSlot.textContent = '●'; // ● — set as text, not HTML
  liveSlot.title = title;
}

let _liveRefetchTimer = null;
function scheduleLiveRefetch() {
  // Live corpus changes update ONLY the count badges — NEVER re-render the
  // current list. Re-rendering on every logged event (logging logs this very
  // session, so events stream constantly) caused a ~per-minute flash that wiped
  // the user's card selection + scroll position. Counts are textContent writes
  // (no flash). Manual nav/refresh pulls fresh rows.
  if (_liveRefetchTimer) return;
  _liveRefetchTimer = setTimeout(() => {
    _liveRefetchTimer = null;
    refreshStats().catch(() => {});
    refreshHealthBadge().catch(() => {});
  }, 500);
}

let _es = null;
let _esReconnectMs = 1000;
let _pollFallbackTimer = null;

function startPollFallback() {
  if (_pollFallbackTimer) return;
  setLiveDot('yellow', 'SSE disconnected — polling counts every 30s');
  // Counts only — do NOT re-render the list (preserves selection/scroll).
  _pollFallbackTimer = setInterval(() => {
    refreshStats().catch(() => {});
    refreshHealthBadge().catch(() => {});
  }, 30000);
}

function stopPollFallback() {
  if (_pollFallbackTimer) {
    clearInterval(_pollFallbackTimer);
    _pollFallbackTimer = null;
  }
}

function connectSSE() {
  if (_es) { try { _es.close(); } catch (e) {} _es = null; }
  const url = pathPrefix() + '/api/events';
  try {
    _es = new EventSource(url);
  } catch (e) {
    setLiveDot('red', 'EventSource unsupported');
    startPollFallback();
    return;
  }
  _es.onopen = () => {
    _esReconnectMs = 1000;
    stopPollFallback();
    setLiveDot('green', 'live — push connected');
  };
  _es.onmessage = (ev) => {
    let payload = null;
    try { payload = JSON.parse(ev.data); } catch (e) {}
    if (!payload) return;
    if (payload.event === 'connected') return;     // initial handshake
    if (payload.event === 'corpus-changed') {
      scheduleLiveRefetch();
    }
  };
  _es.onerror = () => {
    setLiveDot('yellow', 'SSE reconnecting…');
    startPollFallback();
    setTimeout(() => {
      if (_es && _es.readyState === 2 /* CLOSED */) {
        _esReconnectMs = Math.min(_esReconnectMs * 2, 30000);
        connectSSE();
      }
    }, _esReconnectMs);
  };
}

// Boot
(async () => {
  await Promise.all([loadProjects(), refreshStats(), refreshHealthBadge()]);
  navigate(parseHash());
  setInterval(refreshHealthBadge, 30000);
  setInterval(refreshStats, 60000);
  setLiveDot('overlay0', 'connecting…');
  connectSSE();
})();
</script>
