  .session-map-link:last-child { border-bottom:0; }.session-map-link:hover{background:#1e1e30;color:#cdd6f4}.session-map-link.active{background:#cba6f719;color:#f5e8ff;box-shadow:inset 3px 0 #cba6f7,0 0 14px #cba6f71f}

  .markdown { color:#bac2de; font:12px/1.62 system-ui,sans-serif; overflow-wrap:anywhere; }
  .markdown p { margin:.45em 0; }.markdown p:first-child{margin-top:0}.markdown p:last-child{margin-bottom:0}

  .session-table td { padding:11px 12px; border-top:1px solid #313244; color:#a6adc8; }
  .session-table tr { cursor:pointer; }.session-table tbody tr:hover{background:#1e1e30}.session-table .session-name{color:#a6e3a1;font-weight:600;max-width:360px}

<script>
'use strict';

const PERSONAS = ['matt', 'shawn', 'darren', 'eve', 'legion'];

const state = {
  tab: 'sessions',
  projectSlug: '',
  personaFilter: '',
  runtimeFilter: '',
  sourceKindFilter: '',
  prompts: [],
  sessions: [],
  sessionHasMore: false,
  sessionView: 'cards',
  sessionCatalogQuery: '',
  sessionTranscripts: new Map(),
  currentTranscriptData: null,
  searchResults: null,
  searchQuery: '',
  searchMode: 'prompts',
  stats: null,
  projects: [],
  currentSession: null,
  currentTranscriptProject: '',
  currentMessageId: '',
  currentPromptDetail: null,
  transcriptMode: 'clean',
  sessionDetailsVisible: false,
  selectedEventId: '',
  sessionQuery: '',
  sessionTypeFilter: '',
  sessionScrollY: 0,
  liveRefresh: false,
  catalogScrollY: 0,
  routeGeneration: 0,
};

// ── URL / path helpers ─────────────────────────────────────────────

function pathPrefix() {
  const parts = window.location.pathname.split('/').filter(Boolean);
  return parts[0] === 'logging' ? '/logging' : '';
}

function sessionUrl(sessionId, projectSlug = '') {
  const query = projectSlug ? `?project=${encodeURIComponent(projectSlug)}` : '';
  return `${pathPrefix()}/sessions/${encodeURIComponent(sessionId)}${query}`;
}

function sessionEventUrl(sessionId, projectSlug, eventId) {
  return `${sessionUrl(sessionId, projectSlug)}#event-${encodeURIComponent(eventId)}`;
}

function messageUrl(sessionId, projectSlug, eventId) {
  const query = projectSlug ? `?project=${encodeURIComponent(projectSlug)}` : '';
  return `${pathPrefix()}/sessions/${encodeURIComponent(sessionId)}/messages/${encodeURIComponent(eventId)}${query}`;
}

function catalogUrl() { return `${pathPrefix()}/sessions`; }

async function api(path, params) {
  const prefix = pathPrefix();
  const url = new URL(prefix + path, window.location.origin);
  if (params) {
    for (const k in params) {
      if (params[k] !== '' && params[k] != null) {
        url.searchParams.set(k, params[k]);
      }
    }
  }
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error(`${path} → HTTP ${res.status}`);
  return await res.json();
}

// ── Rendering helpers ──────────────────────────────────────────────

function fmtTime(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    const diff = (Date.now() - d) / 1000;
    if (diff < 60) return Math.floor(diff) + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toISOString().slice(0, 10);
  } catch { return iso; }
}

function personaCls(persona) {
  if (!persona) return '';
  return PERSONAS.includes(persona) ? persona : '';
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
}

function shortenSlug(slug) {
  if (!slug) return '';
  // -home-shawn-legion-koi → legion-koi
  // -home-shawn-.claude-plugins-local-legion-plugins-plugins-claude-X → plugins/claude-X
  if (slug.includes('-plugins-local-legion-plugins-plugins-')) {
    const m = slug.match(/-plugins-local-legion-plugins-plugins-(.+)$/);
    if (m) return 'plugins/' + m[1];
  }
  if (slug.startsWith('-home-shawn-')) {
    return slug.replace('-home-shawn-', '');
  }
  return slug;
}

function markdownHtml(source) {
  let text = escapeHtml(String(source || '')).replace(/\r\n?/g, '\n');
  const blocks = [];
  text = text.replace(/```[^\n]*\n([\s\S]*?)```/g, (_, code) => `@@CODE${blocks.push(`<pre><code>${code.trim()}</code></pre>`) - 1}@@`);
  text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>').replace(/^## (.+)$/gm, '<h2>$1</h2>').replace(/^# (.+)$/gm, '<h1>$1</h1>');
  text = text.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  text = text.replace(/^[-*] (.+)$/gm, '<li>$1</li>').replace(/(?:<li>.*<\/li>\n?)+/g, value => `<ul>${value}</ul>`);
  text = text.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  text = text.split(/\n{2,}/).map(block => /^<(?:h\d|ul|blockquote|pre)|^@@CODE/.test(block) ? block : `<p>${block.replace(/\n/g, '<br>')}</p>`).join('');
  return text.replace(/@@CODE(\d+)@@/g, (_, index) => blocks[Number(index)] || '');
}

function renderSessionMessage(event) {
  const content = event.content || event.data?.response || event.data?.prompt || '';
  if (!content) return '';
  const assistant = event.type === 'AssistantResponse';
  const anchor = event.event_id ? `id="event-${escapeHtml(event.event_id)}" data-session-event="${escapeHtml(event.event_id)}"` : '';
  return `<article ${anchor} class="session-message timeline-event ${assistant ? 'assistant' : 'user'}">
    <div class="session-message-role">${assistant ? '◆ assistant' : '▶ user'}</div>
    <div class="markdown">${markdownHtml(content)}</div>

    <div class="message-actions"><button class="message-details-link" data-message-detail="${escapeHtml(event.event_id)}">Details ↗</button></div>
  </article>`;
}

function renderInlineEventDetails(event) {

    <div><dt>event</dt><dd><code>${escapeHtml(event.event_id || '')}</code></dd></div>
  </dl>`;

function firstCompleteSentence(source) {
  const text = String(source || '').replace(/\s+/g, ' ').trim();
  if (!text) return 'No text captured.';
  const match = text.match(/^.{1,280}?(?:[.!?](?=\s|$)|$)/);
  return match?.[0] || `${text.slice(0, 280)}${text.length > 280 ? '…' : ''}`;
}

function sessionSynopsis(events) {
  const conversational = events.filter(event => ['UserPromptSubmit', 'AssistantResponse'].includes(event.type) && event.content?.trim());
  const firstPrompt = conversational.find(event => event.type === 'UserPromptSubmit');
  const lastResponse = [...conversational].reverse().find(event => event.type === 'AssistantResponse');
  const lastPrompt = [...conversational].reverse().find(event => event.type === 'UserPromptSubmit');
  const seen = new Set();
  return [
    ['Opening prompt', firstPrompt],
    ['Latest agent response', lastResponse],
    ['Latest prompt', lastPrompt],
  ].filter(([, event]) => {
    if (!event) return false;
    const key = event.content.replace(/\s+/g, ' ').trim().toLowerCase();
    if (!key || seen.has(key)) return false;
    seen.add(key); return true;
  });
}

function renderSessionExcerpt(label, event) {
  const role = event.type === 'AssistantResponse' ? 'assistant' : 'user';
  return `<details class="session-excerpt ${role}" data-synopsis-label="${escapeHtml(label)}">
    <summary><span class="session-excerpt-label">${escapeHtml(label)}</span>${escapeHtml(firstCompleteSentence(event.content))}</summary>
    <div class="session-excerpt-full markdown">${markdownHtml(event.content)}</div>
  </details>`;
}

async function renderPromptsTab() {
  const main = document.getElementById('view-root');
  main.innerHTML = `
    <div class="mb-3 flex items-center justify-between gap-2 flex-wrap">
      <div class="text-xs text-subtext0">recent prompts${state.projectSlug ? ` in <span class="text-mauve">${escapeHtml(shortenSlug(state.projectSlug))}</span>` : ' · all projects'}${state.runtimeFilter ? ` · <span class="text-sky">${escapeHtml(state.runtimeFilter)}</span>` : ''}${state.personaFilter ? ` · <span class="text-mauve">${escapeHtml(state.personaFilter)}</span>` : ''}</div>
      <input id="quick-q" type="text" placeholder="quick filter…" class="txt text-xs" />
    </div>
    <div id="prompts-list" class="empty">Loading…</div>
  `;
  document.getElementById('quick-q').addEventListener('input', (e) => {
    clearTimeout(window._qDebounce);
    window._qDebounce = setTimeout(() => loadPrompts(e.target.value), 250);
  });
  await loadPrompts('');
}

async function loadPrompts(q) {
  const list = document.getElementById('prompts-list');
  try {
    const params = { limit: 50 };
    if (state.projectSlug) params.project_slug = state.projectSlug;
    if (state.personaFilter) params.persona = state.personaFilter;
    if (state.runtimeFilter) params.runtime = state.runtimeFilter;
    if (state.sourceKindFilter) params.source_kind = state.sourceKindFilter;
    if (q) params.q = q;
    const prompts = await api('/api/prompts', params);
    state.prompts = prompts;
    list.classList.remove('empty');
    if (prompts.length === 0) {
      list.innerHTML = `<div class="empty">No prompts found.</div>`;
      return;
    }
    list.innerHTML = prompts.map(renderPromptCard).join('\n');
    wireCards(list);
  } catch (e) {
    list.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
  }
}

function wireCards(root) {
  root.querySelectorAll('[data-event-id]').forEach(el => {
    el.addEventListener('click', () => {
      const eventId = el.dataset.eventId;
      const prompt = (state.prompts || []).concat(state.searchResults?.results || []).find(p => p.event_id === eventId);
      if (prompt) {
        state.currentPromptDetail = prompt;
        state.currentSession = prompt.session_id;
        renderDetail();
      }
    });
  });
  root.querySelectorAll('.preview').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      el.classList.toggle('expanded');
    });
  });
}

function sessionEventContent(e) {
  return e.content || e.data?.response || e.data?.prompt || e.data?.message || '';
}

function renderConversationMapLink(e) {
  const assistant = e.type === 'AssistantResponse';
  const content = sessionEventContent(e).replace(/\s+/g, ' ').trim();
  return `<button class="session-map-link" data-map-event="${escapeHtml(e.event_id)}"><span class="session-map-glyph ${assistant ? 'assistant' : 'user'}">${assistant ? '◆' : '▶'}</span><span class="session-map-copy">${escapeHtml(content || (assistant ? 'Agent response' : 'User prompt'))}</span></button>`;
}

function wireConversationMinimap(root) {
  window._conversationMinimapObserver?.disconnect();
  const links = new Map([...root.querySelectorAll('[data-map-event]')].map(link => [link.dataset.mapEvent, link]));
  const messages = [...root.querySelectorAll('[data-session-event]')].filter(message => links.has(message.dataset.sessionEvent));
  if (!links.size || !messages.length || typeof IntersectionObserver !== 'function') return;
  const visible = new Set();
  let frame = null;
  const paint = () => {
    frame = null;
    links.forEach((link, eventId) => link.classList.toggle('in-viewport', visible.has(eventId)));
    const firstVisible = [...links.values()].find(link => link.classList.contains('in-viewport'));
    firstVisible?.scrollIntoView({block: 'nearest'});
  };
  window._conversationMinimapObserver = new IntersectionObserver(entries => {
    for (const entry of entries) {
      const eventId = entry.target.dataset.sessionEvent;
      entry.target.classList.toggle('in-viewport', entry.isIntersecting);
      if (entry.isIntersecting) visible.add(eventId); else visible.delete(eventId);
    }
    if (!frame) frame = requestAnimationFrame(paint);
  }, {root: null, rootMargin: '-72px 0px -12% 0px', threshold: [0, 0.05]});
  messages.forEach(message => window._conversationMinimapObserver.observe(message));
}

function visibleSessionEvents(t) {
  let events = state.transcriptMode === 'clean'
    ? t.events.filter(e => ['UserPromptSubmit', 'AssistantResponse'].includes(e.type))
    : t.events;
  if (state.sessionTypeFilter) events = events.filter(e => e.type === state.sessionTypeFilter);
  const q = state.sessionQuery.trim().toLocaleLowerCase();
  if (q) events = events.filter(e => {
    const haystack = [e.type, e.runtime, e.runtime_event, e.tool_name, e.model, sessionEventContent(e)]
      .filter(Boolean).join('\n').toLocaleLowerCase();
    return haystack.includes(q);
  });
  return events;
}

function applySessionFilterVisibility(t, root) {
  const visibleIds = new Set(visibleSessionEvents(t).map(event => event.event_id));
  root.querySelectorAll('[data-session-event]').forEach(element => element.classList.toggle('hidden', !visibleIds.has(element.dataset.sessionEvent)));
  root.querySelectorAll('[data-map-event]').forEach(element => element.classList.toggle('hidden', !visibleIds.has(element.dataset.mapEvent)));
  const count = root.querySelector('#session-filter-count');
  if (count) {
    const filtering = Boolean(state.sessionQuery || state.sessionTypeFilter);
    count.classList.toggle('hidden', !filtering);
    count.textContent = filtering ? `${visibleIds.size} of ${t.events.length}` : '';
  }
}

function formatDuration(ms) {
  if (ms === null || ms === undefined) return '';
  return ms < 1000 ? `${ms} ms` : `${(ms / 1000).toFixed(ms < 10000 ? 1 : 0)} s`;
}

function toolStatusBadge(e) {
  if (!e.tool_status) return '';
  const color = e.tool_status === 'failed' ? 'text-red' : e.tool_status === 'completed' ? 'text-green' : 'text-yellow';
  const glyph = e.tool_status === 'failed' ? '×' : e.tool_status === 'completed' ? '✓' : '●';
  return `<span class="badge ${color}">${glyph} ${escapeHtml(e.tool_status)}</span>`;
}

function jsonSyntaxHtml(value) {
  const json = JSON.stringify(value ?? {}, null, 2);
  const tokenPattern = /("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"\s*:)|("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*")|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|\b(true|false|null)\b/g;
  let cursor = 0;
  let output = '';
  for (const match of json.matchAll(tokenPattern)) {
    output += escapeHtml(json.slice(cursor, match.index));
    const token = match[0];
    const kind = match[1] ? 'json-key' : match[2] ? 'json-string' : match[3] ? 'json-number' : 'json-literal';
    output += `<span class="${kind}">${escapeHtml(token)}</span>`;
    cursor = match.index + token.length;
  }
  return output + escapeHtml(json.slice(cursor));
}

function renderRawPayloadShell(event) {
  const fieldCount = event.data && typeof event.data === 'object' ? Object.keys(event.data).length : 0;
  return `<details class="raw-payload" data-raw-payload="${escapeHtml(event.event_id)}"><summary>Native payload · ${fieldCount} top-level field${fieldCount === 1 ? '' : 's'}</summary><div class="raw-payload-body" data-raw-body><span class="text-overlay0 text-xs">Open to render JSON.</span></div></details>`;
}

function renderTimelineEvent(e, index) {
  const content = sessionEventContent(e);
  const primary = ['UserPromptSubmit', 'AssistantResponse'].includes(e.type);
  const raw = state.transcriptMode === 'raw' ? renderRawPayloadShell(e) : '';
  return `
    <article id="event-${escapeHtml(e.event_id)}" class="timeline-event card p-4 mb-2 cursor-pointer ${primary ? '' : 'compact'}" data-session-event="${escapeHtml(e.event_id)}">
      <div class="flex items-center gap-2 text-xs flex-wrap">
        <span class="badge ${e.type === 'UserPromptSubmit' ? 'text-mauve' : e.type === 'AssistantResponse' ? 'text-green' : 'text-sky'}">${escapeHtml(e.type)}</span>
        ${state.sessionDetailsVisible ? `<span class="badge text-sky">${escapeHtml(e.runtime || 'claude')}</span>
          ${e.tool_name ? `<span class="badge badge-tool">${escapeHtml(e.tool_name)}</span>` : ''}
          ${toolStatusBadge(e)}
          ${e.duration_ms !== null && e.duration_ms !== undefined ? `<span class="text-overlay1">${escapeHtml(formatDuration(e.duration_ms))}</span>` : ''}
          ${e.model ? `<span class="text-overlay1">${escapeHtml(e.model)}</span>` : ''}` : ''}
        <span class="text-overlay0 ml-auto">${escapeHtml((e.ts || '').slice(11, 19))}</span>
      </div>
      ${content ? `<div class="event-body preview text-sm mt-3">${escapeHtml(content)}</div>` : ''}
      ${(e.artifacts || []).length ? `<div class="text-[0.68rem] text-yellow mt-2">${e.artifacts.length} attached artifact${e.artifacts.length === 1 ? '' : 's'}</div>` : ''}

      <div class="message-actions"><button class="message-details-link" data-message-detail="${escapeHtml(e.event_id)}">Details ↗</button></div>
    </article>`;
}

function renderSessionGraph(graph) {
  const heading = graph.kind === 'session_lineage' ? 'SESSION LINEAGE' : `${String(graph.runtime || 'agent').toUpperCase()} SESSION TREE`;
  const allNodes = graph.nodes || [];
  let visibleIndexes = allNodes.map((_, index) => index);
  if (allNodes.length > 240) {
    const keep = new Set([...Array(20).keys()]);
    for (let index = Math.max(20, allNodes.length - 160); index < allNodes.length; index++) keep.add(index);
    const childCounts = new Map();
    allNodes.forEach(node => node.parent_id && childCounts.set(node.parent_id, (childCounts.get(node.parent_id) || 0) + 1));
    allNodes.forEach((node, index) => {
      if (graph.leaves.includes(node.id) || childCounts.get(node.id) > 1 || childCounts.get(node.parent_id) > 1) keep.add(index);
    });
    const ordered = [...keep].sort((a, b) => a - b);
    visibleIndexes = ordered.length > 300 ? [...ordered.slice(0, 20), ...ordered.slice(-280)] : ordered;
  }
  let previous = -1;
  const rows = [];
  visibleIndexes.forEach(index => {
    if (previous >= 0 && index > previous + 1) rows.push(`<div class="text-overlay0 text-[0.65rem] px-2 py-1">⋯ ${index - previous - 1} intermediate nodes</div>`);
    const node = allNodes[index];
    const prefix = node.current ? '◆' : node.parent_id ? '↳' : '•';
    const suffix = graph.leaves.includes(node.id) ? ' ◇' : '';
    const body = `${prefix} ${escapeHtml(node.label)}${suffix}`;
    const attrs = `class="session-map-link text-left ${node.current ? 'active' : ''}" style="padding-left:${8 + Math.min(node.depth, 8) * 10}px" title="${escapeHtml(node.id)}"`;
    rows.push(node.target_session_id
      ? `<button ${attrs} data-lineage-session="${escapeHtml(node.target_session_id)}">${body}</button>`
      : `<div ${attrs}>${body}</div>`);
    previous = index;
  });
  const totalNodes = Number(graph.total_nodes || allNodes.length);
  const summary = totalNodes > visibleIndexes.length ? `<div class="text-overlay0 text-[0.62rem] px-2 pb-2">showing ${visibleIndexes.length.toLocaleString()} of ${totalNodes.toLocaleString()} nodes</div>` : '';
  return `<div class="font-pixel text-mauve p-2 text-[0.58rem]">${escapeHtml(heading)}</div>${summary}${rows.join('')}`;
}

function renderSessionInspector(e) {
  if (!e) return `<div class="text-overlay0 text-xs">Select an event to inspect its provenance and native payload.</div>`;
  return `
    <div class="font-pixel text-mauve mb-3 text-[0.6rem]">MESSAGE METADATA</div>
    <div class="space-y-2 text-xs mb-4">
      <div><span class="text-overlay0">type</span><br><span class="text-sky">${escapeHtml(e.type)}</span></div>
      <div><span class="text-overlay0">runtime</span><br>${escapeHtml(e.runtime || 'claude')} · ${escapeHtml(e.runtime_event || e.type)}</div>
      <div><span class="text-overlay0">timestamp</span><br>${escapeHtml(e.ts)}</div>
      ${e.turn_id ? `<div><span class="text-overlay0">turn</span><br><code>${escapeHtml(e.turn_id)}</code></div>` : ''}
      ${e.tool_call_id ? `<div><span class="text-overlay0">tool call</span><br><code>${escapeHtml(e.tool_call_id)}</code></div>` : ''}
      ${e.tool_status ? `<div><span class="text-overlay0">tool status</span><br>${escapeHtml(e.tool_status)}${e.duration_ms !== null && e.duration_ms !== undefined ? ` · ${escapeHtml(formatDuration(e.duration_ms))}` : ''}</div>` : ''}
      ${e.model ? `<div><span class="text-overlay0">model</span><br>${escapeHtml(e.model)}</div>` : ''}
      ${e.permission_mode ? `<div><span class="text-overlay0">permission</span><br>${escapeHtml(e.permission_mode)}</div>` : ''}
      ${e.capture_source ? `<div><span class="text-overlay0">capture</span><br>${escapeHtml(e.capture_source)}</div>` : ''}
      <div><span class="text-overlay0">source kind</span><br>${escapeHtml(e.source_kind || 'live')}</div>
      <div><span class="text-overlay0">project</span><br>${escapeHtml(shortenSlug(e.project_slug))}</div>
      <div><span class="text-overlay0">event id</span><br><code>${escapeHtml(e.event_id)}</code></div>
    </div>
    <details open><summary class="text-xs text-mauve cursor-pointer mb-2">Native payload</summary>
      ${e.data_loaded === false ? '<div class="text-overlay0 text-xs">Loading native payload…</div>' : `<pre class="inspector-json">${escapeHtml(JSON.stringify(e.data || {}, null, 2))}</pre>`}
    </details>`;
}

async function selectSessionEvent(t, eventId, scroll = false, updateUrl = true) {
  state.selectedEventId = eventId;
  document.querySelectorAll('[data-session-event]').forEach(el => el.classList.toggle('selected', el.dataset.sessionEvent === eventId));
  document.querySelectorAll('[data-map-event]').forEach(el => el.classList.toggle('active', el.dataset.mapEvent === eventId));
  const event = t.events.find(item => item.event_id === eventId);
  if (updateUrl && event && window.location.hash !== `#event-${encodeURIComponent(eventId)}`) {
    history.replaceState(
      {...(history.state || {}), sessionDetail: true, selectedEventId: eventId},
      '',
      sessionEventUrl(t.session_id, state.currentTranscriptProject || t.project_slug || '', eventId),
    );
  }
  const inspector = document.getElementById('session-inspector-content');
  if (inspector) inspector.innerHTML = renderSessionInspector(event);
  if (scroll) document.getElementById(`event-${eventId}`)?.scrollIntoView({behavior: 'smooth', block: 'start'});
  if (event && event.data_loaded === false) {
    try {
      const detail = await api('/api/event', {session: t.session_id, event: eventId});
      if (state.selectedEventId !== eventId || detail.error) return;
      Object.assign(event, detail);
      if (inspector) inspector.innerHTML = renderSessionInspector(event);
    } catch (error) {
      if (inspector && state.selectedEventId === eventId) inspector.innerHTML += `<div class="text-red text-xs mt-2">${escapeHtml(error.message)}</div>`;
    }
  }
}

function clearSessionSelection(t, updateUrl = true) {
  state.selectedEventId = '';
  document.querySelectorAll('[data-session-event].selected').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('[data-map-event].active').forEach(el => el.classList.remove('active'));
  if (updateUrl) {
    history.replaceState(
      {...(history.state || {}), sessionDetail: true, selectedEventId: ''},
      '',
      sessionUrl(t.session_id, state.currentTranscriptProject || t.project_slug || ''),
    );
  }
}

function toggleSessionSelection(t, eventId, scroll = true) {
  if (state.selectedEventId === eventId) clearSessionSelection(t);
  else selectSessionEvent(t, eventId, scroll);
}

function wireTranscriptInteractions(root, t) {
  root.querySelectorAll('[data-session-event]:not([data-interaction-wired])').forEach(element => {
    element.dataset.interactionWired = 'true';
    element.addEventListener('click', () => toggleSessionSelection(t, element.dataset.sessionEvent, false));
  });
  root.querySelectorAll('[data-message-detail]:not([data-interaction-wired])').forEach(button => {
    button.dataset.interactionWired = 'true';
    button.addEventListener('click', event => {
      event.preventDefault();
      event.stopPropagation();
      openMessageDetail(t.session_id, state.currentTranscriptProject || t.project_slug || '', button.dataset.messageDetail);
    });
  });
  root.querySelectorAll('[data-map-event]:not([data-interaction-wired])').forEach(element => {
    element.dataset.interactionWired = 'true';
    element.addEventListener('click', () => toggleSessionSelection(t, element.dataset.mapEvent));
  });
  root.querySelectorAll('[data-raw-payload]:not([data-interaction-wired])').forEach(details => {
    details.dataset.interactionWired = 'true';
    details.addEventListener('click', event => event.stopPropagation());
    details.addEventListener('toggle', () => {
      if (!details.open || details.dataset.rendered === 'true') return;
      const event = (t.events || []).find(item => item.event_id === details.dataset.rawPayload);
      const body = details.querySelector('[data-raw-body]');
      if (!event || !body) return;
      body.innerHTML = `<pre class="raw-json">${jsonSyntaxHtml(event.data || {})}</pre>`;
      details.dataset.rendered = 'true';
    });
  });
}

function openMessageDetail(sessionId, projectSlug, eventId) {
  state.currentMessageId = eventId;
  history.pushState({route: 'message-detail', sessionDetail: true}, '', messageUrl(sessionId, projectSlug, eventId));
  renderRoute();
}

function backToTranscript() {
  state.currentMessageId = '';
  const url = state.selectedEventId
    ? sessionEventUrl(state.currentSession, state.currentTranscriptProject, state.selectedEventId)
    : sessionUrl(state.currentSession, state.currentTranscriptProject);
  history.pushState({route: 'session-detail', sessionDetail: true, selectedEventId: state.selectedEventId}, '', url);
  renderRoute();
}

function openSession(sessionId, projectSlug = '', options = {}) {
  const fromCatalog = !document.body.classList.contains('session-explorer');
  if (fromCatalog) {
    state.catalogScrollY = window.scrollY;
    history.replaceState({
      route: 'sessions', tab: 'sessions', catalogScrollY: state.catalogScrollY,
      sessionView: state.sessionView, sessionCatalogQuery: state.sessionCatalogQuery,
    }, '', catalogUrl());
  }
  state.currentSession = sessionId;
  state.currentTranscriptProject = projectSlug;
  state.currentTranscriptData = null;
  state.currentMessageId = '';
  state.selectedEventId = '';
  const url = sessionUrl(sessionId, projectSlug);
  const historyState = {route: 'session-detail', sessionDetail: true, fromCatalog, catalogScrollY: state.catalogScrollY};
  options.replace ? history.replaceState(historyState, '', url) : history.pushState(historyState, '', url);
  renderRoute();
}

function backToSessions() {
  if (history.state?.fromCatalog && history.length > 1) {
    history.back();
    return;
  }
  state.currentSession = null;
  state.currentTranscriptProject = '';
  state.currentMessageId = '';
  history.pushState({route: 'sessions', tab: 'sessions', catalogScrollY: state.catalogScrollY}, '', catalogUrl());
  renderRoute({useSessionCache: true});
}

async function loadSessionCatalog({append = false} = {}) {
  const pageSize = state.sessionView === 'cards' ? 12 : 100;
  const offset = append ? state.sessions.length : 0;
  const page = await api('/api/sessions', {
    limit: pageSize, offset, project_slug: state.projectSlug, runtime: state.runtimeFilter, source_kind: state.sourceKindFilter,
  });
  state.sessions = append ? [...state.sessions, ...page] : page;
  state.sessionHasMore = page.length === pageSize;
  return state.sessions;
}

async function renderTranscriptTab({useCache = false, useTranscriptCache = false} = {}) {
  window._conversationMinimapObserver?.disconnect();
  const main = document.getElementById('view-root');
  const routeGeneration = state.routeGeneration;
  const routeSession = state.currentSession || '';
  const routeIsCurrent = () => state.tab === 'sessions' && state.routeGeneration === routeGeneration && (state.currentSession || '') === routeSession;
  if (!routeSession) {
    document.body.classList.remove('session-explorer');
    try {
      if (!state.sessions.length) main.innerHTML = `<div class="empty">Loading sessions…</div>`;
      const sessions = useCache ? state.sessions : await loadSessionCatalog();
      if (!routeIsCurrent()) return;
      if (sessions.length === 0) {
        main.innerHTML = `<div class="empty">No sessions captured.</div>`;
        return;
      }
      const query = state.sessionCatalogQuery.trim().toLowerCase();
      const visible = query ? sessions.filter(t => [t.title, t.description, t.opening_prompt, t.project_slug, ...(t.runtimes || [])].join(' ').toLowerCase().includes(query)) : sessions;
      main.innerHTML = `
        <div class="mb-3"><div class="font-pixel text-mauve text-[0.7rem] mb-2">SESSION ARCHIVE</div><div class="text-xs text-subtext0">Every harness. Every conversation. One living record.</div></div>

            <button class="view-button ${state.sessionView === 'table' ? 'active' : ''}" data-session-view="table" aria-pressed="${state.sessionView === 'table'}">☷ Table</button>
          </div>
          <span class="text-[0.65rem] text-overlay0">${visible.length.toLocaleString()} shown · newest first</span>
        </div>
        ${visible.length ? (state.sessionView === 'cards' ? `<div class="session-card-grid">${visible.map(renderSessionDeckCard).join('')}</div>` : renderSessionTable(visible)) : '<div class="empty">No loaded sessions match this search.</div>'}
        ${state.sessionHasMore ? `<button class="view-nav-item w-full mt-3" data-action="load-more-sessions">Load ${state.sessionView === 'cards' ? '12' : '100'} more sessions</button>` : ''}`;
      const searchInput = document.getElementById('session-catalog-search');
      searchInput?.addEventListener('input', event => {
        state.sessionCatalogQuery = event.target.value;
        clearTimeout(window._sessionCatalogSearchTimer);
        window._sessionCatalogSearchTimer = setTimeout(() => {
          const selection = event.target.selectionStart;

          });

      });
      main.querySelectorAll('[data-session-view]').forEach(button => button.addEventListener('click', async () => {
        const nextView = button.dataset.sessionView;

        state.sessions = [];

        try { localStorage.setItem('legion.logging.sessions.view', nextView); } catch (error) {}
        await renderTranscriptTab();
      }));
      main.querySelectorAll('[data-session-row]').forEach(row => {
        row.addEventListener('click', event => {
          if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
          event.preventDefault();
          openSession(row.dataset.sessionRow, row.dataset.sessionProject || '');
        });
      });
      main.querySelectorAll('.preview').forEach(el => el.addEventListener('click', event => {
        event.preventDefault(); event.stopPropagation(); el.classList.toggle('expanded');
      }));
      main.querySelectorAll('.session-excerpt summary').forEach(el => {
        el.addEventListener('click', async event => {
          event.preventDefault(); event.stopPropagation();
          const detail = el.closest('details'); detail.open = !detail.open;
          if (!detail.open || detail.dataset.full === 'true') return;
          const card = detail.closest('[data-session-row]');
          const full = detail.querySelector('.session-excerpt-full');
          full.innerHTML = '<span class="text-overlay0">Loading complete text…</span>';
          try {
            let transcript = state.sessionTranscripts.get(card.dataset.sessionRow);
            if (!transcript) {
              transcript = await api('/api/transcript', {session: card.dataset.sessionRow, project_slug: card.dataset.sessionProject || '', mode: 'clean'});
              if (!transcript.error) state.sessionTranscripts.set(card.dataset.sessionRow, transcript);
            }
            const item = sessionSynopsis(transcript.events || []).find(([label]) => label === detail.dataset.synopsisLabel);
            full.innerHTML = item ? markdownHtml(item[1].content) : '<span class="text-overlay0">Complete text unavailable.</span>';
            detail.dataset.full = 'true';
          } catch (error) { full.innerHTML = `<span class="text-red">${escapeHtml(error.message)}</span>`; }
        });
      });
      main.querySelector('[data-action="load-more-sessions"]')?.addEventListener('click', async event => {
        event.currentTarget.textContent = 'Loading…';
        event.currentTarget.disabled = true;
        try {
          await loadSessionCatalog({append: true});
          await renderTranscriptTab({useCache: true});
        } catch (error) {
          event.currentTarget.textContent = `Retry · ${error.message}`;
          event.currentTarget.disabled = false;
        }
      });
      requestAnimationFrame(() => window.scrollTo(0, state.catalogScrollY || 0));

      main.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
    }
    return;
  }

  document.body.classList.add('session-explorer');
  if (!main.querySelector('.session-shell') && !main.querySelector('.message-detail')) main.innerHTML = `<div class="empty">Opening session…</div>`;
  try {
    const catalogPromise = state.sessions.length ? Promise.resolve(state.sessions) : loadSessionCatalog();
    const transcriptPromise = useTranscriptCache && state.currentTranscriptData?.session_id === routeSession
      ? Promise.resolve(state.currentTranscriptData)
      : api('/api/transcript', {
          session: state.currentSession,
          project_slug: state.currentTranscriptProject,
          mode: state.transcriptMode === 'raw' ? 'full' : 'explore',

      transcriptPromise,

    state.currentTranscriptData = t;

        return;
      }

      }

        <header class="session-masthead">
          <nav class="session-breadcrumbs" aria-label="Breadcrumb"><button data-action="back-to-sessions">Legion</button><span>/</span><button data-action="back-to-sessions">Sessions</button><span>/</span><button data-action="back-to-transcript">${escapeHtml(t.title)}</button><span>/</span><code>${escapeHtml(message.event_id)}</code></nav>

      <div class="session-shell">

              <div class="session-detail-meta"><span class="text-[0.65rem] text-overlay0">${escapeHtml(shortenSlug(t.project_slug))}</span><span class="text-surface2">·</span><span class="text-[0.65rem] text-overlay0">${escapeHtml(t.started_at || '')}</span>
                ${(t.runtimes || []).map(r => `<span class="badge text-sky">${escapeHtml(r)}</span>`).join('')}

    state.liveRefresh = false;
  } catch (e) {
    main.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
  }
}

async function refreshCurrentSessionIncrementally() {
  const previous = state.currentTranscriptData;
  const sessionId = state.currentSession;
  const main = document.getElementById('view-root');
  const timeline = document.getElementById('session-timeline');
  const map = main.querySelector('.session-map');
  if (!previous || !sessionId || !timeline || !map || state.currentMessageId) {
    await renderTranscriptTab();
    return;
  }
  const next = await api('/api/transcript', {
    session: sessionId,
    project_slug: state.currentTranscriptProject,
    mode: state.transcriptMode === 'raw' ? 'full' : 'explore',
  });
  if (next.error || state.currentSession !== sessionId) return;
  const priorIds = new Set((previous.events || []).map(event => event.event_id));
  const additions = (next.events || []).filter(event => !priorIds.has(event.event_id));
  state.currentTranscriptData = next;
  const count = document.getElementById('session-event-count');
  if (count) count.textContent = `${Number(next.total_event_count || next.events?.length || 0).toLocaleString()} events`;
  if (!additions.length) return;

  const visibleAdditions = state.transcriptMode === 'clean'
    ? additions.filter(event => ['UserPromptSubmit', 'AssistantResponse'].includes(event.type))
    : additions;
  if (visibleAdditions.length) {
    const renderer = state.transcriptMode === 'clean' ? renderSessionMessage : renderTimelineEvent;
    timeline.insertAdjacentHTML('beforeend', visibleAdditions.map(renderer).join('\n'));
  }
  const conversationAdditions = additions.filter(event => ['UserPromptSubmit', 'AssistantResponse'].includes(event.type));
  if (conversationAdditions.length) map.insertAdjacentHTML('beforeend', conversationAdditions.map(renderConversationMapLink).join(''));
  wireTranscriptInteractions(main, next);
  applySessionFilterVisibility(next, main);
  wireConversationMinimap(main);
}

async function renderSearchTab() {
  const main = document.getElementById('view-root');
  main.innerHTML = `
    <form id="search-form" class="mb-4 flex gap-2 items-center flex-wrap">
      <input id="global-search" type="search" name="q" value="${escapeHtml(state.searchQuery)}" placeholder="Search every prompt, response, tool event…" class="txt flex-1 min-w-[260px]" autocomplete="off" autofocus />
      <select name="mode" class="txt">
        <option value="prompts" ${state.searchMode === 'prompts' ? 'selected' : ''}>Prompts</option>
        <option value="events" ${state.searchMode === 'events' ? 'selected' : ''}>All events</option>
      </select>
      <button type="submit" class="view-nav-item active">Go</button>
    </form>
    <div class="text-xs text-overlay0 mb-3">FTS5 supports: <code>foo AND bar</code>, <code>"exact phrase"</code>, <code>fo*</code>. Hyphens auto-quoted.</div>
    <div id="search-results"></div>
  `;
  const form = document.getElementById('search-form');
  const resultsEl = document.getElementById('search-results');
  let requestSequence = 0;
  const runSearch = async () => {
    const q = state.searchQuery.trim();
    const mode = state.searchMode;
    if (!q) { resultsEl.innerHTML = ''; return; }
    const sequence = ++requestSequence;
    resultsEl.innerHTML = `<div class="empty">Searching…</div>`;
    try {
      const r = await api('/api/search', { q, mode, runtime: state.runtimeFilter, source_kind: state.sourceKindFilter });
      if (sequence !== requestSequence) return;
      state.searchResults = r;
      if (r.results.length === 0) {
        resultsEl.innerHTML = `<div class="empty">No matches for "${escapeHtml(q)}".</div>`;
        return;
      }
      resultsEl.innerHTML = `
        <div class="text-xs text-subtext0 mb-2">${r.results.length} match${r.results.length === 1 ? '' : 'es'} for "${escapeHtml(r.q)}" (${escapeHtml(r.mode)} mode)</div>
        ${r.results.map(renderPromptCard).join('\n')}
      `;
      wireCards(resultsEl);
    } catch (e) {
      if (sequence !== requestSequence) return;
      resultsEl.innerHTML = `<div class="empty text-red">Error: ${escapeHtml(e.message)}</div>`;
    }
  };
  form.addEventListener('submit', e => { e.preventDefault(); runSearch(); });
  const input = document.getElementById('global-search');
  input.addEventListener('input', () => {
    state.searchQuery = input.value;
    clearTimeout(window._globalSearchTimer);
    window._globalSearchTimer = setTimeout(runSearch, 180);
  });
  form.elements.mode.addEventListener('change', event => { state.searchMode = event.target.value; runSearch(); });
  if (state.searchQuery) runSearch();
}

// ── Navigation ─────────────────────────────────────────────────────

const tabRenderers = {
  sessions: renderTranscriptTab,
  prompts: renderPromptsTab,
  search: renderSearchTab,
  settings: renderSettingsTab,
};

function renderRoute({useSessionCache = false} = {}) {
  state.routeGeneration += 1;
  const tab = state.tab;
  document.querySelectorAll('.view-nav-item[data-tab]').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  if (tab === 'sessions') renderTranscriptTab({useCache: useSessionCache});
  else tabRenderers[tab]?.();
  document.body.classList.remove('scrim-open');
  document.getElementById('mobile-scrim').classList.add('hidden');
}

function navigate(tab, options = {}) {
  if (!tabRenderers[tab]) tab = 'sessions';
  state.tab = tab;
  state.currentSession = '';
  state.currentTranscriptProject = '';
  state.currentMessageId = '';
  document.body.classList.remove('session-explorer');
  const url = tab === 'sessions' ? catalogUrl() : `${pathPrefix()}/#${tab}`;
  options.replace ? history.replaceState({tab}, '', url) : history.pushState({tab}, '', url);
  renderRoute({useSessionCache: tab === 'sessions' && state.sessions.length > 0});
}

function applyLocation() {
  const prefix = pathPrefix();
  const localPath = window.location.pathname.slice(prefix.length) || '/';
  const messageMatch = localPath.match(/^\/sessions\/([^/]+)\/messages\/([^/]+)\/?$/);
  if (messageMatch) {
    state.tab = 'sessions';
    state.currentSession = decodeURIComponent(messageMatch[1]);
    state.currentMessageId = decodeURIComponent(messageMatch[2]);
    state.currentTranscriptProject = new URLSearchParams(window.location.search).get('project') || '';
    return;
  }
  const match = localPath.match(/^\/sessions\/([^/]+)\/?$/);
  if (match) {
    state.tab = 'sessions';
    state.currentSession = decodeURIComponent(match[1]);
    state.currentMessageId = '';
    state.currentTranscriptProject = new URLSearchParams(window.location.search).get('project') || '';
    const eventMatch = window.location.hash.match(/^#event-(.+)$/);
    state.selectedEventId = eventMatch ? decodeURIComponent(eventMatch[1]) : (history.state?.selectedEventId || '');
    return;
  }
  if (localPath === '/sessions' || localPath === '/sessions/') {
    state.tab = 'sessions'; state.currentSession = ''; state.currentTranscriptProject = ''; state.currentMessageId = '';
    return;
  }
  const hash = window.location.hash.replace(/^#/, '');
  if (!hash) { state.tab = 'sessions'; state.currentSession = ''; return; }
  const [tab, query] = hash.split('?');
  if (query) {
    const qp = new URLSearchParams(query);
    if (qp.has('session')) {
      state.currentSession = qp.get('session');
      state.currentTranscriptProject = qp.get('project') || '';
      state.tab = 'sessions';
      history.replaceState({sessionDetail: true}, '', sessionUrl(state.currentSession, state.currentTranscriptProject));
      return;
    }
  }
  state.tab = tabRenderers[tab] ? tab : 'sessions';
  state.currentSession = '';
}

// ── Real-time push (task-534 Phase 2) ──────────────────────────────
//
// Subscribes to /api/events SSE on the kernel. On every corpus-changed
// payload (push by the rollup_daemon via signature_fn polling at 200ms),
// re-render the currently visible tab. Falls back to a 15s polling refresh
// when the stream disconnects. live-slot dot reflects current state.

const liveSlot = document.getElementById('live-slot');
function setLiveDot(color, title) {
  liveSlot.className = `text-xs text-${color}`;
  liveSlot.textContent = '●'; // ● — set as text, not HTML
  liveSlot.title = title;
}

let _liveRefetchTimer = null;
let _liveRefreshPending = false;
function userIsEditing() {
  const active = document.activeElement;
  return Boolean(active && (active.matches('input, textarea, select') || active.isContentEditable));
}

function scheduleLiveRefetch() {
  // Coalesce bursts: multiple corpus-changed events within 100ms become
  // one re-render.
  if (userIsEditing()) {
    _liveRefreshPending = true;
    return;
  }
  if (_liveRefetchTimer) return;
  _liveRefetchTimer = setTimeout(() => {
    _liveRefetchTimer = null;
    if (userIsEditing()) {
      _liveRefreshPending = true;
      return;
    }
    _liveRefreshPending = false;
    if (state.tab === 'sessions' && state.currentSession && state.currentMessageId) {
      state.sessionScrollY = window.scrollY;
      state.liveRefresh = true;
    }
    const r = state.tab === 'sessions' && state.currentSession && !state.currentMessageId
      ? refreshCurrentSessionIncrementally
      : tabRenderers[state.tab];
    if (r) Promise.resolve(r()).catch(e => console.warn('live re-render failed:', e));
    refreshStats().catch(() => {});
    loadProjects().catch(() => {});
    refreshHealthBadge().catch(() => {});
  }, 100);
}

document.addEventListener('focusout', () => setTimeout(() => {
  if (_liveRefreshPending && !userIsEditing()) scheduleLiveRefetch();
}, 0));

let _es = null;
let _esReconnectMs = 1000;
let _pollFallbackTimer = null;
let _liveLeader = false;
let _liveElectionTimer = null;
const _liveInstanceId = (globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`);
const _liveScope = pathPrefix() || '/';
const _liveLeaderKey = `legion.logging.live-leader:${_liveScope}`;
const _liveChannel = typeof BroadcastChannel === 'function'
  ? new BroadcastChannel(`legion.logging.live:${_liveScope}`)
  : null;

function startPollFallback() {
  if (_pollFallbackTimer) return;
  setLiveDot('yellow', 'SSE disconnected — polling every 15s');
  _pollFallbackTimer = setInterval(() => {
    const r = tabRenderers[state.tab];
    if (r) Promise.resolve(r()).catch(() => {});
  }, 15000);
}

function stopPollFallback() {
  if (_pollFallbackTimer) {
    clearInterval(_pollFallbackTimer);
    _pollFallbackTimer = null;
  }
}

function connectSSE() {
  if (_liveChannel && !_liveLeader) return;
  if (_es) { try { _es.close(); } catch (e) {} _es = null; }
  const url = pathPrefix() + '/api/events';
  try {
    _es = new EventSource(url);
  } catch (e) {
    setLiveDot('red', 'EventSource unsupported');
    startPollFallback();
    return;
  }
  _es.onopen = () => {
    _esReconnectMs = 1000;
    stopPollFallback();
    setLiveDot('yellow', 'push connected — checking ingestion');
    refreshHealthBadge().catch(() => {});
  };
  _es.onmessage = (ev) => {
    let payload = null;
    try { payload = JSON.parse(ev.data); } catch (e) {}
    if (!payload) return;
    if (payload.event === 'connected') return;     // initial handshake
    if (payload.event === 'corpus-changed') {
      scheduleLiveRefetch();
      _liveChannel?.postMessage({type: 'corpus-changed'});
    }
  };
  _es.onerror = () => {
    setLiveDot('yellow', 'SSE reconnecting…');
    startPollFallback();
    setTimeout(() => {
      if ((!_liveChannel || _liveLeader) && _es && _es.readyState === 2 /* CLOSED */) {
        _esReconnectMs = Math.min(_esReconnectMs * 2, 30000);
        connectSSE();
      }
    }, _esReconnectMs);
  };
}

function readLiveLeader() {
  try { return JSON.parse(localStorage.getItem(_liveLeaderKey) || 'null'); }
  catch (error) { return null; }
}

function releaseLiveLeadership() {
  if (!_liveLeader) return;
  _liveLeader = false;
  if (_es) { try { _es.close(); } catch (error) {} _es = null; }
  stopPollFallback();
}

function electLiveLeader() {
  // BroadcastChannel lets every open logging tab share one long-lived SSE
  // connection. This avoids exhausting the browser's HTTP/1.1 origin pool.
  if (!_liveChannel) { _liveLeader = true; connectSSE(); return; }
  const now = Date.now();
  const incumbent = readLiveLeader();
  if (!incumbent || incumbent.expires < now || incumbent.id === _liveInstanceId) {
    try {
      localStorage.setItem(_liveLeaderKey, JSON.stringify({id: _liveInstanceId, expires: now + 6000}));
      const won = readLiveLeader()?.id === _liveInstanceId;
      if (won && !_liveLeader) {
        _liveLeader = true;
        connectSSE();
      }
      return;
    } catch (error) {
      _liveLeader = true;
      connectSSE();
      return;
    }
  }
  if (_liveLeader) releaseLiveLeadership();
  setLiveDot('green', 'live via shared browser connection');
}

function startLivePush() {
  if (_liveChannel) {
    _liveChannel.onmessage = event => {
      if (event.data?.type === 'corpus-changed') scheduleLiveRefetch();
    };
    window.addEventListener('storage', event => {
      if (event.key === _liveLeaderKey) electLiveLeader();
    });
    window.addEventListener('beforeunload', () => {
      if (readLiveLeader()?.id === _liveInstanceId) {
        try { localStorage.removeItem(_liveLeaderKey); } catch (error) {}
      }
      releaseLiveLeadership();
    });
    electLiveLeader();
    _liveElectionTimer = setInterval(electLiveLeader, 2000);
  } else {
    _liveLeader = true;
    connectSSE();
  }
}

// Boot
(async () => {
  try { state.sessionView = localStorage.getItem('legion.logging.sessions.view') === 'table' ? 'table' : 'cards'; } catch (error) {}
  renderPersonaFilter();
  applyLocation();
  if (state.tab === 'sessions' && !state.currentSession) {
    history.replaceState({route: 'sessions', tab: 'sessions', catalogScrollY: state.catalogScrollY}, '', catalogUrl());
  } else {
    history.replaceState({...history.state, route: state.currentSession ? 'session-detail' : state.tab, tab: state.tab}, '', window.location.href);
  }
  renderRoute();
  loadProjects().catch(error => console.warn('projects boot failed:', error));
  refreshStats().catch(error => console.warn('stats boot failed:', error));
  refreshHealthBadge().catch(error => console.warn('health boot failed:', error));
  setInterval(refreshHealthBadge, 30000);
  setInterval(refreshStats, 60000);
  setLiveDot('overlay0', 'connecting…');
  startLivePush();
})();
